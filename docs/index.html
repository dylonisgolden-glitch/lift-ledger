      x.primary = mu.primary; x.secondary = mu.secondary;
      try { await backend.putExercise(x); return x; } catch (e) { fail(e, 'Exercise not created'); return null; }
    },
    async deleteExercise(x) {
      const uses = S.workouts.filter(w => (w.exercises || []).some(en => en.exerciseId === x.id)).length;
      if (uses) {
        const ok = await confirm({ title: 'Archive instead?', body: `${x.name} appears in ${plural(uses, 'workout')}, so deleting it would break their history. Archiving hides it from the exercise picker and keeps every record.`, ok: x.archived ? 'Keep archived' : 'Archive exercise' });
        if (ok && !x.archived) { try { await backend.putExercise({ ...x, archived: true }); toast(`${x.name} archived`, 'good'); } catch (e) { fail(e, 'Not archived'); } }
        return;
      }
      const ok = await confirm({ title: 'Delete exercise?', body: `${x.name} has no logged sets. It will be removed from your library.`, ok: 'Delete exercise', danger: true });
      if (!ok) return;
      try { await backend.deleteExercise(x.id); setExSel(null); toast(`${x.name} deleted`, 'good'); } catch (e) { fail(e, 'Not deleted'); }
    },
    async editWorkout(w) { if (!(await guardDraft(w.id))) return; setDraft(workoutToDraft(w, { editing: true })); nav('log'); },
    async duplicateWorkout(w) {
      if (!(await guardDraft(null))) return;
      setDraft(workoutToDraft(w, { id: uid('w'), date: todayStr(), editing: false, createdAt: null, sample: false, resetDone: true, clearNotes: true }));
      nav('log'); toast('Copied to a new workout dated today. Tick sets as you go, then save.', 'info', 5000);
    },
    async deleteWorkout(w) {
      const n = (w.exercises || []).reduce((a, e) => a + (e.sets || []).length, 0);
      const ok = await confirm({ title: 'Delete this workout?', body: `${w.name || 'Workout'} on ${fmtD(w.date)} and its ${plural(n, 'set')} will be removed permanently. Records and charts recalculate without it.`, ok: 'Delete workout', danger: true });
      if (!ok) return;
      try { await backend.deleteWorkout(w.id); toast('Workout deleted', 'good'); actions.syncBoard({ workouts: S.workouts.filter(o => o.id !== w.id) }); if (draft.id === w.id) setDraft(emptyDraft(S.settings)); } catch (e) { fail(e, 'Workout not deleted'); }
    },
    compareWith(w) {
      const others = model.ws.filter(o => o.id !== w.id);
      const other = cmp.b && cmp.b !== w.id ? cmp.b : (others.length ? others[others.length - 1].id : null);
      setCmp({ a: w.id, b: other });
      setTimeout(() => { const el = document.getElementById('compare'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 150);
    },
    async logOnDate(date) { if (!(await guardDraft(null))) return; setDraft({ ...emptyDraft(S.settings), date }); nav('log'); },
    logExercise(x) { if (x.archived) { toast('Unarchive this exercise to log it.', 'bad'); return; } setDraft(d => ({ ...d, exercises: [...d.exercises, newEntry(model, x.id)] })); nav('log'); },
    openAnalytics(id, metric) { setAna(a => ({ ...a, view: 'exercise', ex: id, metric: metric || null })); nav('analytics'); },
    openMuscle(m) { setAna(a => ({ ...a, view: 'muscle', muscle: m })); nav('analytics'); },
    // Republishes this person's leaderboard summary after their data changes; does nothing unless they opted in.
    async syncBoard(o) {
      o = o || {};
      const settings = o.settings || S.settings, comp = compOf(settings);
      if (!comp.enabled || !backend || !backend.putBoard) return;
      const entry = buildEntry(o.workouts || S.workouts, o.exercises || S.exercises, settings, comp, false);
      const next = sanitizeEntry(S.myId, entry), mine = S.board.find(e => e.id === S.myId);
      const key = e => JSON.stringify({ ...e, id: 0, asOf: 0 });
      if (!o.force && mine && key(mine) === key(next)) return;
      try { await backend.putBoard(entry); } catch (e) { fail(e, 'Leaderboard entry not updated'); return; }
      if (mine && S.board.length > 1) {
        const before = myStandings(S.board, S.myId, MIN_GROUP), after = myStandings(S.board.map(e => (e.id === S.myId ? next : e)), S.myId, MIN_GROUP);
        const up = after.map(a => ({ a, b: before.find(b => b.key === a.key) })).filter(x => x.b && x.a.rank < x.b.rank).sort((p, q) => p.a.rank - q.a.rank)[0];
        if (up) toast(`Rankings: you moved up to #${up.a.rank} in ${up.a.label}.`, 'pr', 6000);
      }
    },
    async savePlan(doc) {
      if (!backend || !backend.putPlan) return false;
      try { await backend.putPlan({ ...doc, updatedAt: Date.now(), createdAt: doc.createdAt || Date.now() }); toast('Plan saved', 'good'); return true; }
      catch (e) { fail(e, 'Plan not saved'); return false; }
    },
    async savePresetAsPlan(prog, freq) {
      const sched = prog.schedules[freq] || prog.schedules[Object.keys(prog.schedules)[0]];
      const keys = new Set(sched.filter(Boolean));
      const plan = { id: uid('p'), name: `${prog.name} · ${freq} days`, basedOn: prog.id, level: prog.level, goals: prog.goals.slice(), desc: prog.desc, progression: prog.progression, schedule: sched.slice(),
        workouts: prog.workouts.filter(w => keys.has(w.key)).map(w => ({ key: w.key, name: w.name, cat: CAT[w.cat] ? w.cat : null, ex: w.ex.map(e => { const x = resolveEx({ S }, e); return { exId: x ? x.id : null, name: e.name, sets: e.sets, reps: e.reps, rest: e.rest }; }) })), createdAt: Date.now() };
      return (await actions.savePlan(plan)) ? plan : null;
    },
    async deletePlan(plan) {
      const ok = await confirm({ title: 'Delete this plan?', body: `${plan.name} will be removed. Workouts you logged from it stay in your history.`, ok: 'Delete plan', danger: true });
      if (!ok) return false;
      try { await backend.deletePlan(plan.id); } catch (e) { fail(e, 'Plan not deleted'); return false; }
      if (S.settings.activePlan && S.settings.activePlan.id === plan.id) await actions.saveSettings({ activePlan: null });
      toast('Plan deleted', 'good');
      return true;
    },
    async setActivePlan(prog, freq) {
      await actions.saveSettings({ activePlan: prog ? { id: prog.id, freq: String(freq) } : null });
      toast(prog ? `${prog.name} is your active plan. Today’s workout shows on the Dashboard and in Log Workout.` : 'You stopped using this plan.', 'good', 5000);
    },
    // Builds a Log Workout draft from a plan day, adding any exercises the library doesn't have yet.
    async startPlanWorkout(prog, key) {
      const wk = prog.workouts.find(w => w.key === key);
      if (!wk || !wk.ex.length) return;
      if (!(await guardDraft(null))) return;
      const known = S.exercises.slice(), entries = [];
      for (const e of wk.ex) {
        let x = resolveEx({ S: { exercises: known } }, e);
        if (!x) {
          x = await actions.createExercise({ name: e.name, type: guessType(e.name), muscle: categoryFor(inferMuscles(e.name, 'Other').primary) });
          if (!x) return;
          known.push(x);
        }
        entries.push({ key: rk(), exerciseId: x.id, notes: '', showNotes: false, target: `${e.sets} × ${repsLabel(e.reps)} · rest ${fmtRest(e.rest || 90)}`, targetReps: lowReps(e.reps),
          sets: Array.from({ length: Math.max(1, Math.min(20, Number(e.sets) || 3)) }, () => ({ key: rk(), w: '', r: '', d: false })) });
      }
      setDraft({ ...emptyDraft(S.settings), name: wk.name, exercises: entries, category: CAT[wk.cat] ? wk.cat : '' });
      nav('log');
      toast(`${wk.name} is ready. Targets come from ${prog.name}; enter weights and tick sets as you go.`, 'good', 5000);
    },
    async setCompetition(next, o) {
      const base = store.state.settings;
      const prev = compOf(base);
      if (next.enabled && isMinor(base)) { toast(`Rankings are for people ${SOCIAL_MIN_AGE} and over.`, 'info'); return false; }
      const comp = { enabled: !!next.enabled, visibility: next.visibility === 'public' ? 'public' : 'anonymous', alias: next.alias || prev.alias || newAlias(), relative: !!next.relative && Number(S.settings.bodyweight) > 0, overall: !!next.overall, shareDemo: !!next.shareDemo, lifts: (next.lifts || []).filter(k => ALL_LIFTS.includes(k)), muscles: (next.muscles || []).filter(k => MUSCLE[k]) };
      const changes = consentChanges(prev, comp);
      const settings = withActivity({ ...base, competitive: comp, rankPrompt: 'answered' }, changes.map(ch => ({ k: 'consent', d: `${CONSENT_LABEL[ch.k]}: ${ch.granted ? 'on' : 'off'}${o && o.minor ? ' (under 18)' : ''}` })));
      try { await backend.putSettings(settings); } catch (e) { fail(e, 'Ranking settings not saved'); return false; }
      if (changes.length) await recordConsent(changes);
      if (!comp.enabled) {
        try { if (backend.deleteBoard) await backend.deleteBoard(); } catch (e) { fail(e, 'Your leaderboard entry could not be removed. It will be retried next time you open the app'); return true; }
        if (prev.enabled) toast(o && o.minor ? `Rankings are off because they’re for people ${SOCIAL_MIN_AGE} and over. Your leaderboard entry was deleted.` : 'Rankings are off. Your leaderboard entry was deleted; your workout history is untouched.', 'good', 6000);
        if (route === 'rankings') nav('dashboard');
        return true;
      }
      await actions.syncBoard({ settings, force: true });
      toast(prev.enabled ? 'Ranking preferences saved' : 'Rankings are on. Find them under Rankings.', 'good');
      return true;
    },
    openHistory(date) { setHistDate(date); nav('history'); },
    // Records acceptance of the required documents (and the age answer on first use) in private settings and the consent record.
    async acceptLegal({ band, keepRankings }) {
      const base = store.state.settings, prev = legalOf(base), at = Date.now();
      const legal = { ...prev, seen: { ...(prev.seen || {}) } };
      if (band) legal.age = { band, at, minAge: MIN_AGE };
      for (const d of REQUIRED_DOCS) legal[d] = { v: LEGAL_DOCS[d].v, at };
      for (const d of LEGAL_ORDER) legal.seen[d] = LEGAL_DOCS[d].v;
      const patch = { legal };
      if (band === 'teen') patch.profile = { ...(base.profile || {}), ageGroup: 'u18' };
      const events = [{ k: 'accept', d: REQUIRED_DOCS.map(d => `${LEGAL_DOCS[d].title} v${LEGAL_DOCS[d].v}`).join(', ') }];
      if (band) events.push({ k: 'age', d: band === 'teen' ? `${MIN_AGE} to ${SOCIAL_MIN_AGE - 1}` : `${SOCIAL_MIN_AGE} or older` });
      try { await backend.putSettings(withActivity({ ...base, ...patch }, events)); }
      catch (e) { console.error(e); setSessionLegal(legal); toast(`Your acceptance couldn’t be saved: ${describeDbError(e)} You can continue for this visit.`, 'bad', 9000); return; }
      const entries = REQUIRED_DOCS.map(d => ({ k: 'doc:' + d, granted: true, v: LEGAL_DOCS[d].v }));
      const comp = compOf(store.state.settings);
      // People who joined rankings before consent records existed confirm on this screen; their choices are recorded now.
      // Choices made before records existed are logged with version "0"; stopping then records each withdrawal.
      if (keepRankings != null) Object.entries(consentState(comp)).forEach(([k, on]) => { if (on) entries.push({ k, granted: true, v: keepRankings ? LEGAL_DOCS.privacy.v : '0' }); });
      await recordConsent(entries, { docs: REQUIRED_DOCS, age: !!band });
      if (keepRankings === false) await actions.setCompetition({ ...comp, enabled: false });
      window.scrollTo(0, 0);
    },
    async logActivity(k, d) {
      try { await backend.putSettings(withActivity(store.state.settings, [{ k, d }])); } catch (e) { console.error(e); }
    },
    async setAgeBand(band) {
      if (band === 'adult' && !(await confirm({ title: `Are you ${SOCIAL_MIN_AGE} or older?`, body: 'Rankings become available to turn on. They stay off until you choose them.', ok: `I’m ${SOCIAL_MIN_AGE} or older` }))) return;
      const base = store.state.settings, l = legalOf(base), prof = base.profile || {};
      const patch = { legal: { ...l, age: { band, at: Date.now(), minAge: MIN_AGE } }, profile: { ...prof, ageGroup: band === 'teen' ? 'u18' : (prof.ageGroup === 'u18' ? null : prof.ageGroup || null) } };
      try { await backend.putSettings(withActivity({ ...base, ...patch }, [{ k: 'age', d: band === 'teen' ? `${MIN_AGE} to ${SOCIAL_MIN_AGE - 1}` : `${SOCIAL_MIN_AGE} or older` }])); } catch (e) { fail(e, 'Age range not saved'); return; }
      toast(band === 'teen' ? `Saved. Rankings and sharing stay off until ${SOCIAL_MIN_AGE}.` : 'Saved. You can turn on rankings in Privacy & data if you want them.', 'good', 5000);
    },
    async removeBodyweight() {
      const base = store.state.settings, comp = compOf(base);
      try { await backend.putSettings(withActivity({ ...base, bodyweight: null }, [{ k: 'profile', d: 'Removed bodyweight' }])); } catch (e) { fail(e, 'Bodyweight not removed'); return; }
      if (comp.enabled && comp.relative) await actions.setCompetition({ ...comp, relative: false });
      else actions.syncBoard({ settings: store.state.settings });
      toast('Bodyweight removed', 'good');
    },
    async clearDevice() {
      if (!(await confirm({ title: 'Clear data saved in this browser?', body: 'Removes your unsaved workout draft and display settings, such as open panels and chart ranges, from this browser. Your log in your account isn’t affected.', ok: 'Clear browser data', danger: true }))) return;
      setDraft(emptyDraft(store.state.settings));
      const n = clearDeviceData(false);
      toast(n ? 'Cleared Lift Ledger’s data in this browser' : 'Nothing was saved in this browser', 'good');
      actions.logActivity('device', 'Cleared draft and display settings');
    },
    async wipeHistory() {
      const n = S.workouts.length;
      if (!n) { toast('There’s no workout history to delete.', 'info'); return; }
      const ok = await dangerConfirm({ title: 'Delete workout history?', phrase: 'DELETE', ok: 'Delete workout history',
        body: html`<p>This permanently deletes all ${plural(n, 'workout')}${model.sampleWorkouts ? ` (${plural(model.sampleWorkouts, 'sample workout')} included)` : ''}, and the records and charts built from them. Your exercise library, plans, profile and settings stay. It can’t be undone.</p><p>Consider downloading your data first.</p>` });
      if (!ok) return;
      let done = 0, failed = 0;
      setBusy({ done, total: n });
      try { failed = await backend.wipe('history', () => { done++; setBusy({ done: Math.min(done, n), total: n }); }); }
      catch (e) { setBusy(null); fail(e, 'History not deleted'); return; }
      setBusy(null);
      if (draft.editing) setDraft(emptyDraft(S.settings));
      await actions.logActivity('delete-history', `${plural(n - failed, 'workout')} deleted${failed ? `, ${failed} not deleted` : ''}`);
      toast(failed ? `${plural(failed, 'workout')} couldn’t be deleted. Try again.` : 'Workout history deleted. Your exercises, plans and settings are unchanged.', failed ? 'bad' : 'good', 6000);
      actions.syncBoard({ workouts: [], force: true });
    },
    // Deletes everything Lift Ledger stores about this person, in the database and in this browser.
    async deleteAccount() {
      const ok = await dangerConfirm({ title: 'Delete all your data?', phrase: 'DELETE', ok: 'Delete everything',
        body: html`<p>This permanently deletes ${plural(S.workouts.length, 'workout')}, ${plural(S.exercises.length, 'exercise')} and ${plural(S.plans.length, 'plan')}, your profile and settings, your consent record, requests you sent, your leaderboard entry, and what Lift Ledger saved in this browser. It can’t be undone.</p><p>Consider downloading your data first. Your claude.ai account is separate and isn’t affected.</p>` });
      if (!ok) return;
      const total = S.workouts.length + S.exercises.length + S.plans.length + 5;
      let done = 0, failed = 0;
      setBusy({ done, total });
      try { failed = await backend.wipe('all', () => { done++; setBusy({ done: Math.min(done, total), total }); }); }
      catch (e) { setBusy(null); fail(e, 'Your data wasn’t fully deleted'); return; }
      setBusy(null);
      if (failed) { toast(`${plural(failed, 'item')} couldn’t be deleted. Try again; anything already deleted stays deleted.`, 'bad', 9000); return; }
      setDraft(emptyDraft(DEFAULT_SETTINGS));
      clearDeviceData(true);
      setSessionLegal(null);
      setDeleted(true);
      if (location.hash && location.hash !== '#dashboard') location.hash = 'dashboard';
    },
    async submitRequest(kind, msg) {
      if (!backend || !backend.putRequests) return false;
      const items = store.state.myRequests || [];
      const text = String(msg || '').trim().slice(0, REQ_MAX_LEN);
      if (!text) return false;
      if (items.filter(i => i.at > Date.now() - DAY).length >= REQ_PER_DAY) { toast(`You’ve sent ${REQ_PER_DAY} requests in the last day. Please wait before sending another.`, 'bad', 6000); return false; }
      const it = { id: uid('r'), kind: REQ_LABEL[kind] ? kind : 'other', msg: text, at: Date.now(), status: 'open', reply: '', repliedAt: null };
      try { await backend.putRequests([...items, it].slice(-REQ_MAX_ITEMS)); } catch (e) { fail(e, 'Request not sent'); return false; }
      toast('Sent. The developer sees it the next time they open Lift Ledger.', 'good', 6000);
      actions.logActivity('request', REQ_LABEL[it.kind]);
      return true;
    },
    async answerRequest(owner, rid, patch) {
      const doc = S.inbox.find(x => x.uid === owner);
      if (!doc || !backend.putInbox) return false;
      const items = doc.items.map(r => (r.id === rid ? { ...r, ...patch, ...(patch.reply ? { repliedAt: Date.now() } : {}) } : r));
      try { await backend.putInbox(owner, items); } catch (e) { fail(e, 'Request not updated'); return false; }
      toast(patch.reply ? 'Reply saved. They’ll see it in Privacy & data.' : 'Request updated', 'good');
      return true;
    },
    async deleteSample() {
      const sw = S.workouts.filter(w => w.sample), sx = S.exercises.filter(e => e.sample);
      if (!sw.length && !sx.length) return;
      const usedReal = new Set();
      S.workouts.forEach(w => { if (!w.sample) (w.exercises || []).forEach(en => usedReal.add(en.exerciseId)); });
      const kept = sx.filter(e => usedReal.has(e.id)).length;
      const ok = await confirm({ title: 'Delete sample data?', body: `This permanently removes ${plural(sw.length, 'sample workout')} and ${plural(sx.length - kept, 'sample exercise')}. Everything you logged stays.${kept ? ` ${plural(kept, 'sample exercise')} you used in your own workouts will be kept as yours.` : ''}`, ok: 'Delete sample data', danger: true });
      if (!ok) return;
      const total = sw.length + sx.length;
      let done = 0;
      setBusy({ done, total });
      const tasks = [...sw.map(w => () => backend.deleteWorkout(w.id)), ...sx.map(e => () => (usedReal.has(e.id) ? backend.putExercise({ ...e, sample: false }) : backend.deleteExercise(e.id)))];
      const failed = await runPool(tasks, 4, () => { done++; setBusy({ done, total }); });
      setBusy(null);
      toast(failed ? `${plural(failed, 'item')} couldn’t be deleted. Try again.` : 'Sample data deleted', failed ? 'bad' : 'good');
    },
  };
  const app = { S, model, F, route, nav, draft, setDraft, ana, setAna, histDate, setHistDate, exSel, setExSel, cmp, setCmp, modal, setModal, toast, confirm, actions, busy, rank, setRank, rankData, legalDoc, setLegalDoc, openLegal, blockAge, setDeleted };
  const closeModal = () => setModal(null);
  let page;
  if (!S.ready) page = html`<div class="loading"><div class="eyebrow">Lift Ledger</div><p>Loading your training log…</p><div class="skel" style="width:60%"></div><div class="skel" style="width:40%"></div></div>`;
  else if (route === 'log') page = html`<${LogPage} app=${app}/>`;
  else if (route === 'analytics') page = html`<${AnalyticsPage} app=${app}/>`;
  else if (route === 'history') page = html`<${HistoryPage} app=${app}/>`;
  else if (route === 'exercises') page = html`<${ExercisesPage} app=${app}/>`;
  else if (route === 'rankings') page = html`<${RankingsPage} app=${app}/>`;
  else if (route === 'programs') page = html`<${ProgramsPage} app=${app}/>`;
  else if (route === 'visual') page = html`<${VisualPage} app=${app}/>`;
  else if (route === 'profile') page = html`<${ProfilePage} app=${app}/>`;
  else if (route === 'data') page = html`<${DataPage} app=${app}/>`;
  else if (route === 'legal') page = html`<${LegalPage} app=${app}/>`;
  else page = html`<${Dashboard} app=${app}/>`;
  const overlays = html`
    ${modal && modal.kind === 'confirm' ? html`<${ConfirmModal} m=${modal} close=${v => { setModal(null); modal.resolve(v); }}/>` : null}
    ${modal && modal.kind === 'danger' ? html`<${DangerModal} m=${modal} close=${v => { setModal(null); modal.resolve(v); }}/>` : null}
    ${modal && modal.kind === 'export' ? html`<${ExportModal} app=${app} onClose=${closeModal}/>` : null}
    ${modal && modal.kind === 'settings' ? html`<${SettingsModal} app=${app} onClose=${closeModal}/>` : null}
    ${modal && modal.kind === 'exercise' ? html`<${ExerciseForm} app=${app} x=${modal.x} onClose=${closeModal}/>` : null}
    ${modal && modal.kind === 'csv' ? html`<${CsvModal} app=${app} onClose=${closeModal}/>` : null}
    ${modal && modal.kind === 'compete' ? html`<${ParticipationModal} app=${app} preset=${modal.preset} onClose=${closeModal}/>` : null}
    <div class="toasts" aria-live="polite">${toasts.map(t => html`<div class=${'toast ' + t.tone} key=${t.id}><i></i><span>${t.msg}</span></div>`)}</div>`;
  // Before the app opens: the deletion confirmation, the under-age screen, or the welcome and legal acceptance screens.
  const stage = S.ready && S.settingsLoaded ? gateStage(sessionLegal ? { ...S.settings, legal: sessionLegal } : S.settings) : null;
  const gate = deleted ? html`<${DeletedScreen} app=${app}/>` : ageBlocked ? html`<${AgeBlocked} app=${app}/>` : stage ? html`<${WelcomeGate} app=${app} stage=${stage} key=${stage}/>` : null;
  if (gate) return html`<div class="gate-shell">${gate}${overlays}</div>`;
  return html`<div class="shell">
    <${Rail} app=${app}/>
    <main class="main"><div class="view" key=${route}>${page}</div></main>
    <${Fab} app=${app}/>
    <${TabBar} app=${app}/>
    ${overlays}
  </div>`;
}

const root = document.getElementById('app');
root.textContent = '';
render(html`<${App}/>`, root);
initBackend();
})();
</script>
