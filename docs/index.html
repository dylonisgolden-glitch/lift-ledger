function ExerciseHero({ app, x, rb }) {
  const { model, F, ana, setAna } = app;
  const metrics = metricsFor(x, model);
  const metric = metrics.includes(ana.metric) ? ana.metric : metrics[0];
  const [showTable, setShowTable] = useState(false);
  const ser = exerciseSeries(model, x.id, metric, rb);
  const dv = v => (v == null ? null : F.disp(metric, v));
  const tone = toneOf(ser.change);
  const points = ser.inRange.map(s => ({ t: s.t, v: dv(METRICS[metric].get(s)), sess: s, pr: s.prs.length > 0 }));
  const ath = ser.ath ? { v: dv(ser.ath.v), t: ser.ath.t } : null;
  const shown = ser.last != null ? ser.last : ser.latest;
  const atAth = ser.ath && shown != null && Math.abs(shown - ser.ath.v) < 1e-9 && ser.inRange.length;
  const t0 = rb.key === 'ALL' && ser.list.length ? Math.min(rb.start.getTime(), ser.list[0].t) : rb.start.getTime();
  const tip = p => {
    const s = p.sess;
    return html`<div class="tip-date">${fmtDTip(s.date)}${s.prs.length ? html`<span class="chip pr">PR</span>` : null}${s.sample ? html`<span class="chip sample">Sample</span>` : null}</div>
      <div class="tip-val">${F.dispFmt(metric, p.v)}</div>
      <dl class="tip-rows">
        <dt>Best set</dt><dd>${topSetText(s, F)}</dd>
        ${!isBw(x) || model.bwKg ? html`<dt>Est. 1RM</dt><dd>${F.wu(s.bestE1)}</dd>` : null}
        <dt>Sets</dt><dd>${s.doneCount}${s.doneCount !== s.setCount ? ` of ${s.setCount}` : ''}</dd>
        <dt>Reps</dt><dd>${fmtInt(s.reps)}</dd>
        <dt>Volume</dt><dd>${F.volu(s.volume)}</dd>
        <dt>Workout</dt><dd><${CatBadge} id=${catOfW(app, s.w)} sm code/> ${s.w.name || 'Workout'}</dd>
        ${s.prs.length ? html`<dt>Records</dt><dd>${s.prs.map(pr => PR_LABEL[pr.kind]).join(', ')}</dd>` : null}
      </dl>`;
  };
  const cur = ser.inRange;
  const prevList = ser.list.filter(s => s.date >= rb.ps && s.date <= rb.pe);
  const sumOf = (l, k) => l.reduce((n, s) => n + s[k], 0);
  const volCur = sumOf(cur, 'volume'), volPrev = sumOf(prevList, 'volume');
  const repsCur = sumOf(cur, 'reps'), repsPrev = sumOf(prevList, 'reps');
  const prsCur = cur.filter(s => s.prs.length).length;
  const bestCur = cur.reduce((b, s) => (!b || s.bestE1 > b.bestE1 || (s.bestE1 === b.bestE1 && s.maxReps > b.maxReps) ? s : b), null);
  const cmpLabel = rb.key === 'ALL' ? null : 'vs previous period';
  return html`<section class="panel">
    <div class="quote-head">
      <div style="min-width:0"><div class="row" style="gap:8px"><span class="ticker">${x.ticker || '—'}</span><span class="muted" style="font-size:12.5px">${x.muscle || 'Other'} · ${isBw(x) ? 'Bodyweight' : 'Weighted'}</span>${x.sample ? html`<${SampleChip}/>` : null}</div>
        <h2 class="quote-name">${x.name}</h2></div>
      <button class="btn sm" type="button" onClick=${() => { app.setExSel(x.id); app.nav('exercises'); }}>Exercise history</button>
    </div>
    <div class="quote">
      <span class="figure">${shown != null ? F.dispFmt(metric, dv(shown)).replace(/ (lb|kg|reps?)$/, '') : '—'}<span class="u">${METRICS[metric].kind === 'reps' ? 'reps' : F.u}</span></span>
      ${ser.inRange.length ? html`<${Delta} pill pct=${ser.changePct} abs=${ser.change != null ? signed(dv(ser.change), v => (METRICS[metric].kind === 'vol' ? fmtCompact(v) : fmtNum(v, 1))) : null} label=${rb.label}/>` : html`<span class="delta flat">No sessions in the ${rb.label}${ser.latest != null ? ' · showing latest' : ''}</span>`}
      ${atAth ? html`<span class="chip ath">All-time high</span>` : null}
    </div>
    <div class="metric-tabs"><${Seg} label="Metric" value=${metric} options=${metrics.map(k => [k, metricLabel(k, x, model)])} onChange=${m => setAna(a => ({ ...a, metric: m }))}/></div>
    <${PriceChart} points=${points} baseline=${ser.baseline != null ? dv(ser.baseline) : null} t0=${t0} t1=${rb.end.getTime()} tone=${tone} fmtAxis=${F.dispAxis(metric)} ath=${ath} tip=${tip}
      label=${`${x.name} ${metricLabel(metric, x, model)}, ${rb.label}`} emptyText=${`No ${x.name} sessions in the ${rb.label}. Pick a longer range.`}/>
    <div class="chart-legend">
      ${ser.baseline != null ? html`<span class="k"><span class="lk"></span>Last value before this range</span>` : null}
      ${ath ? html`<span class="k"><span class="lk ath"></span>All-time high ${F.dispFmt(metric, ath.v)} · ${fmtD(ser.ath.date)}</span>` : null}
      <span class="k"><span class="lk pr"></span>Personal record</span>
      <button class="btn sm ghost" type="button" style="margin-left:auto" onClick=${() => setShowTable(v => !v)}>${showTable ? 'Hide data table' : 'Show data table'}</button>
    </div>
    ${showTable ? html`<div class="tbl-wrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>Date</th><th>Best set</th><th class="r">Sets</th><th class="r">Reps</th><th class="r">Volume</th><th class="r">${metricLabel(metric, x, model)}</th><th>Records</th></tr></thead>
      <tbody>${cur.slice().reverse().map(s => html`<tr><td class="nw">${fmtD(s.date)} ${s.sample ? html`<${SampleChip}/>` : null}</td><td class="mono">${topSetText(s, F)}</td><td class="r">${s.doneCount}</td><td class="r">${fmtInt(s.reps)}</td><td class="r">${F.volu(s.volume)}</td><td class="r">${F.metric(metric, METRICS[metric].get(s))}</td><td>${s.prs.map(p => html`<span class="chip pr" style="margin-right:4px">${PR_LABEL[p.kind]}</span>`)}</td></tr>`)}</tbody></table></div>` : null}
    <div class="stats">
      <div class="stat"><div class="kpi-label">All-time high</div><div class="kpi-value">${ser.ath ? F.metric(metric, ser.ath.v) : '—'}</div><div class="kpi-sub">${ser.ath ? fmtD(ser.ath.date) : ''}</div></div>
      <div class="stat"><div class="kpi-label">Sessions</div><div class="kpi-value">${cur.length}</div><div class="kpi-sub"><${Delta} pct=${rb.key === 'ALL' ? null : pctChange(cur.length, prevList.length)} label=${cmpLabel}/></div></div>
      <div class="stat"><div class="kpi-label">Volume</div><div class="kpi-value">${F.volu(volCur)}</div><div class="kpi-sub"><${Delta} pct=${rb.key === 'ALL' ? null : pctChange(volCur, volPrev)} label=${cmpLabel}/></div></div>
      <div class="stat"><div class="kpi-label">Total reps</div><div class="kpi-value">${fmtInt(repsCur)}</div><div class="kpi-sub"><${Delta} pct=${rb.key === 'ALL' ? null : pctChange(repsCur, repsPrev)} label=${cmpLabel}/></div></div>
      <div class="stat"><div class="kpi-label">Best set</div><div class="kpi-value">${bestCur ? topSetText(bestCur, F) : '—'}</div><div class="kpi-sub">${bestCur ? fmtD(bestCur.date) : 'in this range'}</div></div>
      <div class="stat"><div class="kpi-label">PRs</div><div class="kpi-value">${prsCur}</div><div class="kpi-sub">in the ${rb.label}</div></div>
    </div>
  </section>`;
}

function exerciseRecords(list, F, model) {
  const done = list.filter(s => s.doneCount);
  if (!done.length) return [];
  const best = k => done.reduce((b, s) => (s[k] > b[k] ? s : b), done[0]);
  const x = done[0].x;
  const out = [];
  const loadOk = !isBw(x) || model.bwKg > 0;
  if (loadOk || done.some(s => s.maxAdded > 0)) { const s = best('topLoad'); out.push(['Heaviest set', F.wu(s.topLoad), s]); }
  if (loadOk) { const s = best('bestE1'); out.push(['Best estimated 1RM', F.wu(s.bestE1), s]); }
  { const s = best('maxReps'); out.push(['Most reps in one set', plural(s.maxReps, 'rep'), s]); }
  { const s = best('volume'); if (s.volume > 0) out.push(['Best session volume', F.volu(s.volume), s]); }
  { const s = best('reps'); out.push(['Most reps in a session', plural(s.reps, 'rep'), s]); }
  return out;
}

function Records({ app, x }) {
  const { model, F } = app;
  const recs = exerciseRecords(model.byEx.get(x.id) || [], F, model);
  return html`<section class="panel"><div class="panel-head"><div><div class="panel-title">Personal records</div><div class="panel-sub">${x.name} · all time</div></div></div>
    ${recs.length ? recs.map(([l, v, s]) => html`<div class="rec"><span class="rec-label">${l}</span><span class="rec-val">${v}</span><span class="rec-meta">${fmtD(s.date)} · ${topSetText(s, F)}${s.sample ? ' · sample' : ''}</span></div>`) : html`<p class="hint">No completed sets yet.</p>`}
  </section>`;
}

function OverallSection({ app, rb }) {
  const { model, F, S } = app;
  const [metric, setMetric] = useState('volume');
  const [group, setGroup] = useState(rb.len > 200 ? 'month' : 'week');
  const cur = sumRange(model, rb.s, rb.e);
  const prev = rb.key === 'ALL' ? null : sumRange(model, rb.ps, rb.pe);
  const cmp = (a, b) => (prev ? pctChange(a, b) : null);
  const cmpLabel = prev ? 'vs previous period' : null;
  const weeks = Math.max(1, rb.len / 7);
  const buckets = periodBuckets(model, group, rb, S.settings.weekStart === 0 ? 0 : 1);
  const valOf = b => (metric === 'volume' ? fromKg(b.volume, F.u) : metric === 'reps' ? b.reps : metric === 'sets' ? b.sets : b.workouts);
  const bars = buckets.map(b => ({ v: valOf(b), short: bucketShort(b, group), b }));
  const fmtVal = v => (metric === 'volume' ? `${fmtCompact(v)} ${F.u}` : metric === 'reps' ? plural(v, 'rep') : metric === 'sets' ? plural(v, 'set') : plural(v, 'workout'));
  const tip = bar => html`<div class="tip-date">${bucketLabel(bar.b, group)}</div><div class="tip-val">${fmtVal(bar.v)}</div>
    <dl class="tip-rows"><dt>Workouts</dt><dd>${bar.b.workouts}</dd><dt>Sets</dt><dd>${bar.b.sets}</dd><dt>Reps</dt><dd>${fmtInt(bar.b.reps)}</dd><dt>Volume</dt><dd>${F.volu(bar.b.volume)}</dd><dt>PRs</dt><dd>${bar.b.prs}</dd></dl>`;
  const rows = [];
  for (const { x } of model.exWithData) {
    const list = (model.byEx.get(x.id) || []).filter(s => s.doneCount && s.date >= rb.s && s.date <= rb.e);
    if (!list.length) continue;
    const m = defMetric(x);
    const ser = exerciseSeries(model, x.id, m, rb);
    rows.push({ x, n: list.length, sets: list.reduce((a, s) => a + s.doneCount, 0), reps: list.reduce((a, s) => a + s.reps, 0), vol: list.reduce((a, s) => a + s.volume, 0), m, ser });
  }
  rows.sort((a, b) => b.vol - a.vol || b.reps - a.reps);
  return html`
    <h2 class="section-title">All training · ${rb.label}</h2>
    <div class="kpis six" style="margin-bottom:16px">
      <${Kpi} label="Workouts" value=${cur.workouts} sub=${html`<${Delta} pct=${cmp(cur.workouts, prev && prev.workouts)} label=${cmpLabel}/>`}/>
      <${Kpi} label="Per week" value=${fmtNum(cur.workouts / weeks, 1)} sub=${`${plural(cur.workouts, 'session')} over ${plural(Math.round(rb.len), 'day')}`}/>
      <${Kpi} label="Volume" value=${fmtCompact(fromKg(cur.volume, F.u))} unit=${F.u} sub=${html`<${Delta} pct=${cmp(cur.volume, prev && prev.volume)} label=${cmpLabel}/>`}/>
      <${Kpi} label="Total reps" value=${fmtInt(cur.reps)} sub=${html`<${Delta} pct=${cmp(cur.reps, prev && prev.reps)} label=${cmpLabel}/>`}/>
      <${Kpi} label="Completed sets" value=${fmtInt(cur.sets)} sub=${html`<${Delta} pct=${cmp(cur.sets, prev && prev.sets)} label=${cmpLabel}/>`}/>
      <${Kpi} label="PRs" value=${cur.prs} sub=${html`<${Delta} pct=${cmp(cur.prs, prev && prev.prs)} label=${cmpLabel}/>`}/>
    </div>
    <div class="cols">
      <section class="panel">
        <div class="panel-head"><div><div class="panel-title">Training load</div><div class="panel-sub">${group === 'week' ? 'Weekly' : 'Monthly'} totals from completed sets</div></div>
          <div class="row"><${Seg} cls="sm" label="Measure" value=${metric} options=${[['volume', 'Volume'], ['reps', 'Reps'], ['sets', 'Sets'], ['workouts', 'Workouts']]} onChange=${setMetric}/><${Seg} cls="sm" label="Grouping" value=${group} options=${[['week', 'Week'], ['month', 'Month']]} onChange=${setGroup}/></div></div>
        <${BarChart} bars=${bars} fmtAxis=${v => (metric === 'volume' ? fmtCompact(v) : fmtNum(v, 1))} tip=${tip} label=${`${group === 'week' ? 'Weekly' : 'Monthly'} ${metric}, ${rb.label}`}/>
      </section>
      <section class="panel">
        <div class="panel-head"><div><div class="panel-title">By exercise</div><div class="panel-sub">Select a row to chart it</div></div></div>
        ${rows.length ? html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Exercise</th><th class="r">Sessions</th><th class="r">Reps</th><th class="r">Volume</th><th class="r">Change</th></tr></thead>
          <tbody>${rows.map(r => html`<tr class="click" tabindex="0" onClick=${() => { app.setAna(a => ({ ...a, ex: r.x.id })); window.scrollTo({ top: 0, behavior: 'smooth' }); }} onKeyDown=${e => { if (e.key === 'Enter') { app.setAna(a => ({ ...a, ex: r.x.id })); window.scrollTo({ top: 0 }); } }}>
            <td><span class="ticker">${r.x.ticker || '—'}</span> <span style="font-weight:500">${r.x.name}</span></td><td class="r">${r.n}</td><td class="r">${fmtInt(r.reps)}</td><td class="r">${F.volu(r.vol)}</td><td class="r"><${Delta} pct=${r.ser.changePct}/></td></tr>`)}</tbody></table></div>
          <p class="hint" style="margin-top:8px">Change is estimated 1RM (best set reps for bodyweight exercises) against the start of the range.</p>` : html`<p class="hint">No sessions in the ${rb.label}.</p>`}
      </section>
    </div>`;
}

/* ---------------- muscle groups view ---------------- */
function PctCell({ cur, prev, label }) {
  const dl = label ? html` <span class="dl">${label}</span>` : null;
  if (prev == null) return html`<span class="muted">—</span>`;
  if (!(prev > 0)) return cur > 0 ? html`<span class="delta up"><span class="tri" aria-hidden="true">▲</span>New${dl}</span>` : html`<span class="delta flat">—${dl}</span>`;
  return html`<${Delta} pct=${pctChange(cur, prev)} label=${label}/>`;
}
function MuscleChips({ app, muscles }) {
  const rows = [...muscles.entries()].sort((a, b) => (b[1].direct - a[1].direct) || b[1].wsets - a[1].wsets);
  return html`<div class="mchips" aria-label="Muscles worked"><span class="mtk">Muscles</span>${rows.map(([id, v]) => html`<button type="button" class=${'mchip ' + (v.direct ? 'p' : 's')} title=${`${MUSCLE[id].name}: ${fmtNum(v.wsets, 1)} weighted sets${v.direct ? '' : ' (secondary only)'}`} onClick=${() => app.actions.openMuscle(id)}><${AreaDot} m=${id}/>${MUSCLE[id].name} <b>${fmtNum(v.wsets, 1)}</b></button>`)}</div>`;
}
function ExerciseMuscles({ app, x }) {
  const mu = app.model.exMus.get(x.id) || musclesOf(x);
  if (!mu.primary.length && !mu.secondary.length) return html`<p class="hint" style="margin-top:8px">No muscles assigned, so this exercise isn’t counted in muscle analytics. Use Edit to assign them.</p>`;
  return html`<div class="mchips">
    ${mu.primary.map(id => html`<button type="button" class="mchip p" onClick=${() => app.actions.openMuscle(id)}><span class="mtk">Primary</span><${AreaDot} m=${id}/>${MUSCLE[id].name}</button>`)}
    ${mu.secondary.map(id => html`<button type="button" class="mchip s" onClick=${() => app.actions.openMuscle(id)}><span class="mtk">Secondary</span><${AreaDot} m=${id}/>${MUSCLE[id].name}</button>`)}
    ${mu.auto ? html`<span class="hint">Detected from the name. Use Edit to change.</span>` : null}
  </div>`;
}
function MuscleEditor({ mus, setMus, onDetect }) {
  const toggle = (role, id) => setMus(cur => {
    let p = cur.primary.slice(), s = cur.secondary.slice();
    if (role === 'p') { if (p.includes(id)) p = p.filter(m => m !== id); else { p.push(id); s = s.filter(m => m !== id); } }
    else if (s.includes(id)) s = s.filter(m => m !== id);
    else { s.push(id); p = p.filter(m => m !== id); }
    return { primary: p, secondary: s, touched: true };
  });
  const row = (role, list, label) => html`<div class="field"><span>${label}</span><div class="mtog-row" role="group" aria-label=${label}>${MUSCLE_LIST.map(([id, name]) => { const on = list.includes(id); return html`<button type="button" class=${'mtog' + (on ? (role === 'p' ? ' on-p' : ' on-s') : '')} aria-pressed=${on ? 'true' : 'false'} onClick=${() => toggle(role, id)}>${name}</button>`; })}</div></div>`;
  return html`<div class="set-block">
    <div class="row between"><h4>Muscles trained</h4><button class="btn sm ghost" type="button" onClick=${onDetect}>Detect from name</button></div>
    ${row('p', mus.primary, 'Primary · full credit')}
    ${row('s', mus.secondary, 'Secondary · half credit')}
    <p class="hint">${mus.primary.length ? `Counts toward ${muscleNames([...mus.primary, ...mus.secondary])} in muscle analytics.` : 'Pick at least one primary muscle so this exercise counts in muscle analytics.'}${mus.touched ? '' : ' Filled in automatically from the name.'}</p>
  </div>`;
}

function MuscleHero({ app, m, rb, group }) {
  const { model, F, ana, setAna, S } = app;
  const ws = S.settings.weekStart === 0 ? 0 : 1;
  const metric = MUSCLE_METRICS[ana.mMetric] ? ana.mMetric : 'workload';
  const def = MUSCLE_METRICS[metric];
  const [showTable, setShowTable] = useState(false);
  const M = MUSCLE[m];
  const list = model.mEvents.get(m) || [];
  const cur = muscleAgg(list, rb.s, rb.e);
  const prev = rb.key === 'ALL' ? null : muscleAgg(list, rb.ps, rb.pe);
  const buckets = makeBuckets(group, rb, ws);
  const aggs = bucketAggs(list, buckets);
  const allB = makeBuckets(group, rangeBounds('ALL', model), ws);
  const allA = bucketAggs(list, allB);
  const records = new Set();
  let run = 0, best = null;
  allB.forEach((b, i) => { const v = def.get(allA[i]); if (v > run + 1e-9) { if (run > 0) records.add(b.s); run = v; } if (v > 0 && (!best || v > best.v + 1e-9)) best = { v, b }; });
  const firstS = buckets.length ? buckets[0].s : rb.s;
  let baseline = null;
  if (list.some(ev => ev.date < firstS)) { const d = addDays(parseYmd(firstS), -1); const pb = makeBuckets(group, { start: d, end: d }, ws); if (pb.length) baseline = mDisp(metric, def.get(bucketAggs(list, pb)[0]), F); }
  const points = cur.aW.size ? buckets.map((b, i) => ({ t: b.start.getTime(), v: mDisp(metric, def.get(aggs[i]), F), b, a: aggs[i], pr: records.has(b.s) })) : [];
  const total = def.get(cur), prevTotal = prev ? def.get(prev) : null;
  const change = prev ? total - prevTotal : null;
  const tone = prev && prevTotal > 0 ? toneOf(change) : 'flat';
  const ath = best ? { v: mDisp(metric, best.v, F), t: best.b.start.getTime() } : null;
  const [num, unit] = mParts(metric, mDisp(metric, total, F), F);
  const T = todayStr();
  const nPrim = model.exVisible.filter(x => (model.exMus.get(x.id) || { primary: [] }).primary.includes(m)).length;
  const nSec = model.exVisible.filter(x => (model.exMus.get(x.id) || { secondary: [] }).secondary.includes(m)).length;
  const weeks = Math.max(1, rb.len / 7);
  const lastA = aggs[aggs.length - 1];
  const topEx = a => { let t = null; for (const c of a.ex.values()) if (!t || c.workload > t.workload || (c.workload === t.workload && c.wsets > t.wsets)) t = c; return t ? exOf(model, t.exId).name : null; };
  const tip = p => {
    const a = p.a, top = topEx(a);
    return html`<div class="tip-date">${gLabel(p.b)}${p.pr ? html`<span class="chip pr">Record</span>` : null}${p.b.s <= T && p.b.e >= T ? html`<span class="chip plain">In progress</span>` : null}</div>
      <div class="tip-val">${mFmt(metric, p.v, F)}</div>
      <dl class="tip-rows">
        <dt>Workload</dt><dd>${F.volu(a.workload)}</dd>
        <dt>Direct volume</dt><dd>${F.volu(a.volDirect)}</dd>
        <dt>Secondary volume</dt><dd>${F.volu(a.volSec)}</dd>
        <dt>Direct sets</dt><dd>${a.setsDirect}</dd>
        <dt>Secondary sets</dt><dd>${a.setsSec}</dd>
        <dt>Weighted sets</dt><dd>${fmtNum(a.wsets, 1)}</dd>
        <dt>Reps</dt><dd>${fmtInt(a.repsDirect)}${a.repsSec ? ` + ${fmtInt(a.repsSec)} sec.` : ''}</dd>
        <dt>Sessions</dt><dd>${a.sessDirect}${a.sessAny > a.sessDirect ? ` + ${a.sessAny - a.sessDirect} sec.` : ''}</dd>
        ${top ? html`<dt>Top exercise</dt><dd>${top}</dd>` : null}
      </dl>`;
  };
  const cmpLabel = prev ? 'vs previous period' : null;
  return html`<section class="panel">
    <div class="quote-head">
      <div style="min-width:0"><div class="row" style="gap:8px"><span class="ticker">${M.ticker}</span><${AreaTag} m=${m}/><span class="muted" style="font-size:12.5px">${REGION_LABEL[M.region]} · primary in ${plural(nPrim, 'exercise')}, secondary in ${nSec}</span></div>
        <h2 class="quote-name">${M.name}</h2></div>
      ${visualOn(app) ? html`<${BodyMap} roles=${{ [m]: 'p' }} size=${120} label=${`${M.name} highlighted on a body diagram`}/>` : null}
    </div>
    <div class="quote">
      <span class="figure">${num}<span class="u">${unit}</span></span>
      ${prev ? html`<${Delta} pill pct=${prevTotal > 0 ? change / prevTotal * 100 : null} abs=${prevTotal > 0 ? signed(mDisp(metric, change, F), v => mParts(metric, v, F)[0]) : null} label=${`${rb.label} vs the period before`}/>` : html`<span class="delta flat">${def.label}, ${rb.label}</span>`}
      ${best && lastA && cur.aW.size && Math.abs(def.get(lastA) - best.v) < 1e-9 ? html`<span class="chip ath">Record ${group}</span>` : null}
    </div>
    <div class="metric-tabs"><${Seg} label="Metric" value=${metric} options=${Object.entries(MUSCLE_METRICS).map(([k, d]) => [k, d.label])} onChange=${v => setAna(a => ({ ...a, mMetric: v }))}/></div>
    <${PriceChart} points=${points} baseline=${baseline} t0=${buckets.length ? buckets[0].start.getTime() : rb.start.getTime()} t1=${rb.end.getTime()} tone=${tone} fmtAxis=${mAxis(metric)} ath=${ath} tip=${tip}
      label=${`${M.name} ${def.label.toLowerCase()} by ${group}, ${rb.label}`} emptyText=${`No ${M.name.toLowerCase()} work logged in the ${rb.label}.`}/>
    <div class="chart-legend">
      ${baseline != null ? html`<span class="k"><span class="lk"></span>Previous ${group}</span>` : null}
      ${ath ? html`<span class="k"><span class="lk ath"></span>Best ${group}: ${mFmt(metric, ath.v, F)} · ${gLabel(best.b)}</span>` : null}
      <span class="k"><span class="lk pr"></span>Record ${group}</span>
      <button class="btn sm ghost" type="button" style="margin-left:auto" onClick=${() => setShowTable(v => !v)}>${showTable ? 'Hide data table' : 'Show data table'}</button>
    </div>
    <p class="hint" style="margin-top:6px">${MUSCLE_NOTE}</p>
    ${showTable ? html`<div class="tbl-wrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>${GROUP_NOUN[group]}</th><th class="r">Workload</th><th class="r">Direct sets</th><th class="r">Secondary sets</th><th class="r">Weighted sets</th><th class="r">Reps</th><th class="r">Sessions</th></tr></thead>
      <tbody>${buckets.map((b, i) => [b, aggs[i]]).reverse().slice(0, 120).map(([b, a]) => html`<tr><td class="nw">${gLabel(b)}${records.has(b.s) ? html` <span class="chip pr">Record</span>` : null}</td><td class="r">${F.volu(a.workload)}</td><td class="r">${a.setsDirect}</td><td class="r">${a.setsSec}</td><td class="r">${fmtNum(a.wsets, 1)}</td><td class="r">${fmtInt(a.repsDirect)}</td><td class="r">${a.sessDirect}</td></tr>`)}</tbody></table></div>` : null}
    <div class="stats">
      <div class="stat"><div class="kpi-label">Direct volume</div><div class="kpi-value">${F.volu(cur.volDirect)}</div><div class="kpi-sub"><${PctCell} cur=${cur.volDirect} prev=${prev && prev.volDirect} label=${cmpLabel}/></div></div>
      <div class="stat"><div class="kpi-label">Secondary volume</div><div class="kpi-value">${F.volu(cur.volSec)}</div><div class="kpi-sub"><${PctCell} cur=${cur.volSec} prev=${prev && prev.volSec} label=${cmpLabel}/></div></div>
      <div class="stat"><div class="kpi-label">Direct sets</div><div class="kpi-value">${fmtInt(cur.setsDirect)}</div><div class="kpi-sub"><${PctCell} cur=${cur.setsDirect} prev=${prev && prev.setsDirect} label=${cmpLabel}/></div></div>
      <div class="stat"><div class="kpi-label">Secondary sets</div><div class="kpi-value">${fmtInt(cur.setsSec)}</div><div class="kpi-sub"><${PctCell} cur=${cur.setsSec} prev=${prev && prev.setsSec} label=${cmpLabel}/></div></div>
      <div class="stat"><div class="kpi-label">Weighted sets / week</div><div class="kpi-value">${fmtNum(cur.wsets / weeks, 1)}</div><div class="kpi-sub"><${PctCell} cur=${cur.wsets} prev=${prev && prev.wsets} label=${cmpLabel}/></div></div>
      <div class="stat"><div class="kpi-label">Sessions</div><div class="kpi-value">${cur.sessDirect}</div><div class="kpi-sub">${fmtNum(cur.sessDirect / weeks, 1)} per week${cur.sessAny > cur.sessDirect ? ` · +${cur.sessAny - cur.sessDirect} secondary only` : ''}</div></div>
    </div>
  </section>`;
}

function MusclePeriods({ app, m }) {
  const { model, F, S } = app;
  const rows = musclePeriodRows(model.mEvents.get(m) || [], S.settings.weekStart === 0 ? 0 : 1);
  return html`<section class="panel">
    <div class="panel-head"><div><div class="panel-title">Period comparison</div><div class="panel-sub">${MUSCLE[m].name} · day, week, month and year against the one before</div></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Period</th><th class="r">Workload</th><th class="r">Change</th><th class="r">Wtd sets</th><th class="r">Change</th></tr></thead>
      <tbody>${rows.map(r => html`<tr><td><div style="font-weight:500">${r.label}</div><div class="hint">${r.sub}</div></td><td class="r">${F.volu(r.cur.workload)}</td><td class="r"><${PctCell} cur=${r.cur.workload} prev=${r.prev ? r.prev.workload : null}/></td><td class="r">${fmtNum(r.cur.wsets, 1)}</td><td class="r"><${PctCell} cur=${r.cur.wsets} prev=${r.prev ? r.prev.wsets : null}/></td></tr>`)}</tbody></table></div>
  </section>`;
}

function MuscleContributors({ app, m, rb }) {
  const { model, F } = app;
  const cur = muscleAgg(model.mEvents.get(m), rb.s, rb.e);
  const rows = [...cur.ex.values()].sort((a, b) => b.workload - a.workload || b.wsets - a.wsets);
  const base = cur.workload > 0 ? 'workload' : 'wsets';
  const tot = cur[base];
  const open = c => app.actions.openAnalytics(c.exId, defMetric(exOf(model, c.exId)));
  return html`<section class="panel">
    <div class="panel-head"><div><div class="panel-title">Contributing exercises</div><div class="panel-sub">${MUSCLE[m].name} · ${rb.label}</div></div></div>
    ${rows.length ? html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Exercise</th><th>Role</th><th class="r">Sets</th><th class="r">Volume</th><th class="r">Share</th></tr></thead>
      <tbody>${rows.map(c => { const x = exOf(model, c.exId); return html`<tr class="click" tabindex="0" onClick=${() => open(c)} onKeyDown=${e => { if (e.key === 'Enter') open(c); }}>
        <td><span class="ticker">${x.ticker || '—'}</span> <span style="font-weight:500">${x.name}</span></td>
        <td><span class=${'mchip ' + c.role}>${c.role === 'p' ? 'Primary' : 'Secondary'}</span></td>
        <td class="r">${c.sets}</td><td class="r">${isBw(x) && !(c.volume > 0) ? plural(c.reps, 'rep') : F.volu(c.volume)}</td><td class="r">${tot ? fmtNum(c[base] / tot * 100, 1) + '%' : '—'}</td></tr>`; })}</tbody></table></div>
      <p class="hint" style="margin-top:8px">Sets and volume are each exercise’s own totals. Share is its part of this muscle’s ${base === 'workload' ? 'workload' : 'weighted sets'}, so that column adds to 100%.</p>`
    : html`<p class="hint">Nothing trained ${MUSCLE[m].name.toLowerCase()} in the ${rb.label}.</p>`}
  </section>`;
}

function MuscleBalance({ app, rb, aggs, sel }) {
  const { model, F, setAna } = app;
  const prevAggs = rb.key === 'ALL' ? null : new Map(MUSCLE_IDS.map(id => [id, muscleAgg(model.mEvents.get(id), rb.ps, rb.pe)]));
  const totalA = MUSCLE_IDS.reduce((n, id) => n + aggs.get(id).asets, 0);
  const totalW = MUSCLE_IDS.reduce((n, id) => n + aggs.get(id).workload, 0);
  const rows = MUSCLE_IDS.map(id => ({ id, a: aggs.get(id), p: prevAggs ? prevAggs.get(id) : null })).sort((x, y) => y.a.wsets - x.a.wsets);
  const maxW = Math.max(1e-9, ...rows.map(r => r.a.wsets));
  const un = [...new Set(model.unassigned.filter(s => s.date >= rb.s && s.date <= rb.e).map(s => exOf(model, s.exId).name))];
  const pick = id => { setAna(a => ({ ...a, muscle: id })); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  return html`<section class="panel">
    <div class="panel-head"><div><div class="panel-title">Muscle balance</div><div class="panel-sub">Weighted sets = direct sets + ½ secondary sets · select a row to chart it</div></div>
      <div class="legend-keys"><span><span class="sw-d"></span>Direct</span><span><span class="sw-s"></span>Secondary (½ credit)</span></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Muscle</th><th style="min-width:150px">Weighted sets</th><th class="r">Direct</th><th class="r">Secondary</th><th class="r">Share of sets</th><th class="r">Share of workload</th><th class="r">Δ Workload</th></tr></thead>
      <tbody>${rows.map(r => html`<tr class="click" tabindex="0" style=${r.id === sel ? 'background:var(--panel-2)' : (r.a.wsets ? '' : 'opacity:.6')} onClick=${() => pick(r.id)} onKeyDown=${e => { if (e.key === 'Enter') pick(r.id); }}>
        <td class="nw"><${AreaDot} m=${r.id}/> <span class="ticker">${MUSCLE[r.id].ticker}</span> <span style="font-weight:500">${MUSCLE[r.id].name}</span></td>
        <td><div class="row" style="flex-wrap:nowrap;gap:8px"><div class="split" style="flex:1" aria-hidden="true"><span class="d" style=${`width:${r.a.setsDirect / maxW * 100}%`}></span><span class="s" style=${`width:${SECONDARY_CREDIT * r.a.setsSec / maxW * 100}%`}></span></div><span class="mono" style="min-width:38px;text-align:right">${fmtNum(r.a.wsets, 1)}</span></div></td>
        <td class="r">${r.a.setsDirect}</td><td class="r">${r.a.setsSec}</td>
        <td class="r">${totalA ? fmtNum(r.a.asets / totalA * 100, 1) + '%' : '—'}</td>
        <td class="r">${totalW ? fmtNum(r.a.workload / totalW * 100, 1) + '%' : '—'}</td>
        <td class="r">${r.p ? html`<${PctCell} cur=${r.a.workload} prev=${r.p.workload}/>` : html`<span class="muted">—</span>`}</td></tr>`)}</tbody></table></div>
    <div style="margin-top:10px"><${AreaLegend}/></div>
    <p class="hint" style="margin-top:10px">Direct and secondary sets are counted for every muscle an exercise trains, so those columns don’t add up to your total sets. The share columns split each set across its muscles (primary 1, secondary ½), so each adds up to 100%.</p>
    ${un.length ? html`<p class="hint" style="margin-top:6px">Not counted: ${un.join(', ')} ${un.length === 1 ? 'has' : 'have'} no muscles assigned. <a href="#exercises">Assign muscles in Exercises</a>.</p>` : null}
  </section>`;
}

const PAIRS = [['chest', 'back', 'Push vs pull'], ['quads', 'hamstrings', 'Quads vs hamstrings'], ['biceps', 'triceps', 'Biceps vs triceps'], ['core', 'lowerback', 'Abs vs lower back']];
function MusclePairs({ rb, aggs }) {
  const region = { upper: 0, lower: 0, core: 0 };
  MUSCLE_IDS.forEach(id => { region[MUSCLE[id].region] += aggs.get(id).asets; });
  const pair = (label, an, bn, a, b) => {
    const tot = a + b, r = b > 0 ? a / b : null;
    let status = 'Balanced', lean = false;
    if (!tot) status = 'No data';
    else if (!a || !b) { status = `Only ${a ? an : bn}`; lean = true; }
    else if (r < 2 / 3 || r > 1.5) { status = `Leans ${r > 1 ? an : bn}`; lean = true; }
    return html`<div class="pair">
      <div class="row between"><span style="font-weight:500">${label}</span><span class=${'chip ' + (lean ? 'lean' : 'plain')}>${status}</span></div>
      <div class="pair-bar" aria-hidden="true">${tot ? html`<span class="a" style=${`width:${a / tot * 100}%`}></span><span class="b" style=${`width:${b / tot * 100}%`}></span>` : html`<span style="flex:1;background:var(--panel-2)"></span>`}</div>
      <div class="row between hint"><span><span class="lkey" style="border-color:var(--cat-1)"></span> ${an} ${fmtNum(a, 1)}</span><span class="mono">${a && b ? `${fmtNum(r, 2)} : 1` : ''}</span><span>${bn} ${fmtNum(b, 1)} <span class="lkey" style="border-color:var(--cat-2)"></span></span></div>
    </div>`;
  };
  return html`<section class="panel">
    <div class="panel-head"><div><div class="panel-title">Opposing muscle groups</div><div class="panel-sub">Weighted sets, ${rb.label} · balanced between 2:3 and 3:2</div></div></div>
    <div class="pairs">
      ${PAIRS.map(([a, b, l]) => pair(l, MUSCLE[a].name, MUSCLE[b].name, aggs.get(a).wsets, aggs.get(b).wsets))}
      ${pair('Upper vs lower body', 'Upper', 'Lower', region.upper, region.lower)}
    </div>
    <p class="hint" style="margin-top:10px">Upper vs lower uses split sets, so each set counts once. Programs differ, so treat a lean as a prompt to check your plan, not a rule.</p>
  </section>`;
}

function MuscleCompare({ app, rb, group, sel, aggs }) {
  const { model, F, S, ana, setAna, toast } = app;
  const ws = S.settings.weekStart === 0 ? 0 : 1;
  let slots = Array.isArray(ana.cmpSlots) ? ana.cmpSlots : null;
  if (!slots) { const ant = ANTAGONIST[sel]; const third = MUSCLE_IDS.filter(id => id !== sel && id !== ant).sort((a, b) => aggs.get(b).wsets - aggs.get(a).wsets)[0]; slots = [sel, ant, third]; }
  const metric = ana.cmpMetric === 'workload' || ana.cmpMetric === 'share' ? ana.cmpMetric : 'wsets';
  const buckets = makeBuckets(group, rb, ws);
  const totals = metric === 'share' ? bucketAggs(model.allEvents, buckets) : null;
  const series = slots.map((id, i) => (id ? { id, name: MUSCLE[id].name, color: `var(--cat-${i + 1})`, vals: bucketAggs(model.mEvents.get(id), buckets).map((a, j) => (metric === 'wsets' ? a.wsets : metric === 'workload' ? fromKg(a.workload, F.u) : (totals[j].asets ? a.asets / totals[j].asets * 100 : 0))) } : null)).filter(Boolean);
  const toggle = id => {
    const next = slots.slice(), at = next.indexOf(id);
    if (at >= 0) next[at] = null;
    else { const free = next.indexOf(null); if (free < 0) { toast('Compare up to three muscle groups. Turn one off first.', 'info'); return; } next[free] = id; }
    setAna(a => ({ ...a, cmpSlots: next }));
  };
  const fmtVal = v => (metric === 'wsets' ? `${fmtNum(v, 1)} sets` : metric === 'workload' ? `${fmtCompact(v)} ${F.u}` : `${fmtNum(v, 1)}%`);
  const fmtAxis = v => (metric === 'workload' ? fmtCompact(v) : metric === 'share' ? `${fmtNum(v, 0)}%` : fmtNum(v, 1));
  return html`<section class="panel">
    <div class="panel-head"><div><div class="panel-title">Compare muscle groups</div><div class="panel-sub">Up to three at once · ${GROUP_ADJ[group].toLowerCase()} totals</div></div>
      <${Seg} cls="sm" label="Compare by" value=${metric} options=${[['wsets', 'Weighted sets'], ['workload', 'Workload'], ['share', 'Share of sets']]} onChange=${v => setAna(a => ({ ...a, cmpMetric: v }))}/></div>
    <div class="row" style="gap:6px;margin-bottom:12px">${MUSCLE_LIST.map(([id, name]) => { const i = slots.indexOf(id); return html`<button type="button" class=${'cmp-chip' + (i >= 0 ? ' on' : '')} aria-pressed=${i >= 0 ? 'true' : 'false'} onClick=${() => toggle(id)}>${i >= 0 ? html`<span class="lkey" style=${`border-color:var(--cat-${i + 1})`}></span>` : null}${name}</button>`; })}</div>
    <${MultiLineChart} series=${series} xs=${buckets.map(b => ({ t: b.start.getTime(), b }))} fmtAxis=${fmtAxis} fmtVal=${fmtVal} tipTitle=${x => gLabel(x.b)} label=${`${series.map(s => s.name).join(', ')} compared by ${metric === 'wsets' ? 'weighted sets' : metric}, ${rb.label}`}/>
    <p class="hint" style="margin-top:8px">${metric === 'share' ? `Share of sets splits each set across the muscles it trains, so a muscle’s share is its part of everything you did that ${group}.` : metric === 'wsets' ? 'Weighted sets count sets rather than load, so they compare fairly between big and small muscles.' : 'Workload is load-based, so heavy lower-body lifts read higher than smaller upper-body ones.'}</p>
  </section>`;
}

function MuscleView({ app, rb, viewSeg }) {
  const { model, ana, setAna } = app;
  const group = ana.group || autoGroup(rb);
  const aggs = new Map(MUSCLE_IDS.map(id => [id, muscleAgg(model.mEvents.get(id), rb.s, rb.e)]));
  const top = MUSCLE_IDS.slice().sort((a, b) => aggs.get(b).wsets - aggs.get(a).wsets)[0];

  return html`
    <div class="filter-row">
      ${viewSeg}
      <label class="grow"><span class="sr">Muscle group</span><select class="input" id="analytics-muscle" value=${m} onChange=${e => setAna(a => ({ ...a, muscle: e.target.value }))}>${MUSCLE_LIST.map(([id, name, tk]) => html`<option value=${id}>${tk} · ${name} (${fmtNum(aggs.get(id).wsets, 1)} sets)</option>`)}</select></label>
      <${Seg} cls="data" label="Time range" value=${ana.range} options=${RANGES} onChange=${r => { lsSet('ll.range', r); setAna(a => ({ ...a, range: r, group: null })); }}/>
      <${Seg} cls="sm" label="Group by" value=${group} options=${GROUPS} onChange=${g => setAna(a => ({ ...a, group: g }))}/>
    </div>
    <div class="cols">
      <${MuscleHero} app=${app} m=${m} rb=${rb} group=${group} key=${m}/>
      <div class="stack"><${MusclePeriods} app=${app} m=${m}/><${CommunityCard} app=${app} board=${'muscle:' + m}/><${MuscleContributors} app=${app} m=${m} rb=${rb}/></div>

function MuscleWatch({ app }) {
  const { model, S } = app;
  const ws = S.settings.weekStart === 0 ? 0 : 1;
  const today = startOfDay(new Date()), T = ymd(today);
  const wk = startOfWeek(today, ws);
  const rows = MUSCLE_IDS.map(id => {
    const list = model.mEvents.get(id) || [];
    const cur = muscleAgg(list, ymd(wk), T);
    const prev = muscleAgg(list, ymd(addDays(wk, -7)), ymd(addDays(today, -7)));
    const spark = Array.from({ length: 8 }, (_, k) => { const s = addDays(wk, -7 * (7 - k)); return muscleAgg(list, ymd(s), ymd(addDays(s, 6))).wsets; });
    return { id, cur, prev, spark, recent: spark.reduce((n, v) => n + v, 0) };
  }).filter(r => r.recent > 0).sort((a, b) => b.cur.wsets - a.cur.wsets || b.recent - a.recent).slice(0, 8);
  return html`<section class="panel">
    <div class="panel-head"><div><div class="panel-title">Muscle groups</div><div class="panel-sub">Weighted sets this week · change vs this point last week</div></div><button class="btn sm ghost" type="button" onClick=${() => app.actions.openMuscle(rows.length ? rows[0].id : 'chest')}>Analyze</button></div>
    ${rows.length ? rows.map(r => html`<button class="watch" type="button" onClick=${() => app.actions.openMuscle(r.id)}>
      <span class="nm"><${AreaDot} m=${r.id}/><span class="ticker">${MUSCLE[r.id].ticker}</span><span>${MUSCLE[r.id].name}</span></span>
      <${Spark} vals=${r.spark} tone=${r.prev.wsets > 0 ? toneOf(r.cur.wsets - r.prev.wsets) : 'flat'}/>
      <span class="val">${fmtNum(r.cur.wsets, 1)} sets<br/><${PctCell} cur=${r.cur.wsets} prev=${r.prev.wsets}/></span>
    </button>`) : html`<p class="hint">No muscle work in the last 8 weeks. Muscle groups appear here as you log exercises.</p>`}
  </section>`;
}

/* ---------------- history ---------------- */
function Calendar({ app, sel, onSel, month, setMonth }) {
  const { model, S } = app;
  const ws = S.settings.weekStart === 0 ? 0 : 1;
  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  const lastDay = new Date(month.getFullYear(), month.getMonth() + 1, 0);
  let d = startOfWeek(first, ws);
  const days = [];
  while (d <= lastDay || days.length % 7) { days.push(d); d = addDays(d, 1); }
  const vols = [...model.dayVol.values()].filter(v => v > 0).sort((a, b) => a - b);
  const q = p => (vols.length ? vols[Math.min(vols.length - 1, Math.floor(p * vols.length))] : 0);
  const q1 = q(0.25), q2 = q(0.5), q3 = q(0.75);
  const prDays = new Set(model.prs.map(s => s.date));
  const today = todayStr();
  const dows = Array.from({ length: 7 }, (_, i) => ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'][(i + ws) % 7]);
  const monthCount = model.ws.filter(w => w.date.slice(0, 7) === ymd(first).slice(0, 7)).length;
  const monthCats = [...new Set(model.ws.filter(w => w.date.slice(0, 7) === ymd(first).slice(0, 7)).map(w => catOfW(app, w)))];
  return html`<div>
    <div class="cal-head">
      <button class="icon-btn" type="button" aria-label="Previous month" onClick=${() => setMonth(new Date(month.getFullYear(), month.getMonth() - 1, 1))}>${Ic.left()}</button>
      <div style="text-align:center"><div class="cal-month">${first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</div><div class="hint">${plural(monthCount, 'workout')}</div></div>
      <button class="icon-btn" type="button" aria-label="Next month" onClick=${() => setMonth(new Date(month.getFullYear(), month.getMonth() + 1, 1))}>${Ic.right()}</button>
    </div>
    <div class="cal" role="grid">
      ${dows.map(n => html`<div class="dow" role="columnheader">${n}</div>`)}
      ${days.map(day => {
        const k = ymd(day);
        const n = model.dayCnt.get(k) || 0;
        const v = model.dayVol.get(k) || 0;
        const lvl = n ? (v <= q1 ? 1 : v <= q2 ? 2 : v <= q3 ? 3 : 4) : 0;
        const cls = ['day', day.getMonth() !== month.getMonth() ? 'out' : '', lvl ? 'l' + lvl : '', k === today ? 'today' : '', k === sel ? 'sel' : ''].join(' ');
        return html`<button class=${cls} type="button" role="gridcell" aria-selected=${k === sel ? 'true' : 'false'} aria-label=${`${fmtDLong(k)}${n ? `, ${(model.byDate.get(k) || []).map(w => CAT[catOfW(app, w)].name).join(' and ')} workout${n > 1 ? 's' : ''}` : ', rest day'}`} onClick=${() => onSel(k)}>
          ${prDays.has(k) ? html`<span class="prd" aria-hidden="true"></span>` : null}
          <span>${day.getDate()}</span>${n ? html`<span class="cnt" aria-hidden="true">${(model.byDate.get(k) || []).slice(0, 3).map(w => html`<i class="cd" style=${`--cc:${catVar(catOfW(app, w))}`}></i>`)}</span>` : null}
        </button>`;
      })}
    </div>
    <div class="cal-legend"><span>Less volume</span><span class="sw" style="background:var(--heat-1)"></span><span class="sw" style="background:var(--heat-2)"></span><span class="sw" style="background:var(--heat-3)"></span><span class="sw" style="background:var(--heat-4)"></span><span>More</span><span style="margin-left:10px" class="row"><span class="sw" style="background:var(--accent);border-radius:50%;width:8px;height:8px"></span>PR set that day</span>
      <button class="btn sm ghost" type="button" style="margin-left:auto" onClick=${() => { setMonth(new Date()); onSel(today); }}>Today</button></div>
    ${monthCats.length ? html`<div style="margin-top:8px"><${CatLegend} ids=${monthCats} note="Dot colors show each day’s workout type"/></div>` : null}
  </div>`;
}

function Summaries({ app }) {
  const { model, F, S } = app;
  const [g, setG] = useState('week');
  const [all, setAll] = useState(false);
  if (!model.ws.length) return null;
  const rb = rangeBounds('ALL', model);
  const buckets = periodBuckets(model, g, rb, S.settings.weekStart === 0 ? 0 : 1);
  const rows = buckets.map((b, i) => ({ b, prev: buckets[i - 1] })).reverse();
  const shown = all ? rows : rows.slice(0, 12);
  return html`<section class="panel">
    <div class="panel-head"><div><div class="panel-title">${g === 'week' ? 'Weekly' : 'Monthly'} summaries</div><div class="panel-sub">Completed sets only · change compares with the ${g} before</div></div><${Seg} cls="sm" label="Summary period" value=${g} options=${[['week', 'Weekly'], ['month', 'Monthly']]} onChange=${v => { setG(v); setAll(false); }}/></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>${g === 'week' ? 'Week of' : 'Month'}</th><th class="r">Workouts</th><th>Types</th><th class="r">Sets</th><th class="r">Reps</th><th class="r">Volume</th><th class="r">Δ Volume</th><th class="r">PRs</th></tr></thead>
      <tbody>${shown.map(({ b, prev }) => html`<tr><td class="nw">${g === 'week' ? fmtD(b.s) : b.start.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</td><td class="r">${b.workouts}</td><td><${CatCounts} cats=${b.cats}/></td><td class="r">${b.sets}</td><td class="r">${fmtInt(b.reps)}</td><td class="r">${F.volu(b.volume)}</td><td class="r">${prev ? html`<${Delta} pct=${pctChange(b.volume, prev.volume)}/>` : html`<span class="muted">—</span>`}</td><td class="r">${b.prs || html`<span class="muted">0</span>`}</td></tr>`)}</tbody></table></div>
    ${rows.length > 12 ? html`<button class="btn sm ghost" type="button" style="margin-top:8px" onClick=${() => setAll(v => !v)}>${all ? 'Show fewer' : `Show all ${rows.length}`}</button>` : null}

}

function ComparePanel({ app }) {
  const { model, F, cmp, setCmp } = app;
  const opts = model.ws.slice().reverse();
  if (opts.length < 2) return html`<section class="panel" id="compare"><div class="panel-title">Compare workouts</div><p class="hint" style="margin-top:8px">Log at least two workouts to compare them side by side.</p></section>`;
  const a = model.ws.find(w => w.id === cmp.a) || opts[1];
  const b = model.ws.find(w => w.id === cmp.b) || opts[0];
  const sa = model.wStats.get(a.id), sb = model.wStats.get(b.id);
  const label = w => `${fmtD(w.date)} · ${w.name || 'Workout'}${w.sample ? ' (sample)' : ''}`;
  const ids = [];
  for (const s of [...sa.sessions, ...sb.sessions]) if (!ids.includes(s.exId)) ids.push(s.exId);
  const D = (v, f) => (v == null || Math.abs(v) < 1e-9 ? html`<span class="muted">—</span>` : html`<span class=${'delta ' + toneOf(v)}>${signed(v, f)}</span>`);
  const row = (name, va, vb, f, num) => html`<tr><td>${name}</td><td class="r">${f(va)}</td><td class="r">${f(vb)}</td><td class="r">${num ? D(vb - va, f) : ''}</td></tr>`;
  const sel = (which, w) => html`<label class="field" style="flex:1 1 240px"><span>Workout ${which}</span><select class="input" id=${'compare-' + which.toLowerCase()} value=${w.id} onChange=${e => setCmp(c => ({ a: c.a || a.id, b: c.b || b.id, [which.toLowerCase()]: e.target.value }))}>${opts.map(o => html`<option value=${o.id}>${label(o)}</option>`)}</select></label>`;
  return html`<section class="panel" id="compare">
    <div class="panel-head"><div><div class="panel-title">Compare workouts</div><div class="panel-sub">Δ shows B minus A</div></div><button class="btn sm ghost" type="button" onClick=${() => setCmp({ a: b.id, b: a.id })}>Swap A and B</button></div>
    <div class="row" style="align-items:flex-end;margin-bottom:12px">${sel('A', a)}${sel('B', b)}</div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th></th><th class="r"><${CatBadge} id=${sa.cat} sm code/> A · ${fmtDShort(a.date)}</th><th class="r"><${CatBadge} id=${sb.cat} sm code/> B · ${fmtDShort(b.date)}</th><th class="r">Δ</th></tr></thead>
      <tbody>
        ${row('Exercises', sa.exCount, sb.exCount, v => fmtInt(v), true)}
        ${row('Completed sets', sa.doneSets, sb.doneSets, v => fmtInt(v), true)}
        ${row('Total reps', sa.reps, sb.reps, v => fmtInt(v), true)}
        ${row('Volume', sa.volume, sb.volume, v => F.volu(v), true)}
        ${row('PRs', sa.prs.length, sb.prs.length, v => fmtInt(v), true)}
      </tbody>
    </table></div>
    <div class="tbl-wrap" style="margin-top:14px"><table class="tbl">
      <thead><tr><th>Exercise</th><th>A sets</th><th>B sets</th><th class="r">Δ Volume</th><th class="r">Δ Best</th></tr></thead>
      <tbody>${ids.map(id => {
        const x = exOf(model, id);
        const ea = sa.sessions.find(s => s.exId === id), eb = sb.sessions.find(s => s.exId === id);
        const useE1 = !isBw(x) || model.bwKg > 0;
        const bestA = ea ? (useE1 ? ea.bestE1 : ea.maxReps) : null, bestB = eb ? (useE1 ? eb.bestE1 : eb.maxReps) : null;
        return html`<tr><td><span class="ticker">${x.ticker || '—'}</span> ${x.name}</td>
          <td class="sets-cell">${ea ? doneSetsText(ea, F) || 'No completed sets' : html`<span class="muted">Not performed</span>`}</td>
          <td class="sets-cell">${eb ? doneSetsText(eb, F) || 'No completed sets' : html`<span class="muted">Not performed</span>`}</td>
          <td class="r">${ea && eb ? D(eb.volume - ea.volume, v => F.volu(v)) : html`<span class="muted">—</span>`}</td>
          <td class="r">${ea && eb ? D(bestB - bestA, v => (useE1 ? F.wu(v) : plural(v, 'rep'))) : html`<span class="muted">—</span>`}</td></tr>`;
      })}</tbody>
    </table></div>
    <p class="hint" style="margin-top:8px">Δ Best compares estimated 1RM (most reps in a set for bodyweight exercises).</p>
  </section>`;
}

function WorkoutLog({ app }) {
  const { model, F } = app;
  const [q, setQ] = useState('');
  const [limit, setLimit] = useState(30);
  const qq = normName(q);
  const list = model.ws.slice().reverse().filter(w => !qq || normName(w.name).includes(qq) || normName(w.notes).includes(qq) || (w.exercises || []).some(en => normName(exOf(model, en.exerciseId).name).includes(qq)));
  const groups = [];
  for (const w of list.slice(0, limit)) {
    const k = w.date.slice(0, 7);
    let g = groups[groups.length - 1];
    if (!g || g.k !== k) { g = { k, items: [], vol: 0 }; groups.push(g); }
    g.items.push(w); g.vol += model.wStats.get(w.id).volume;
  }
  return html`<section class="panel">
    <div class="panel-head"><div><div class="panel-title">All workouts</div><div class="panel-sub">${plural(model.ws.length, 'workout')} logged</div></div>
      <label style="flex:1 1 220px;max-width:320px"><span class="sr">Search workouts</span><input class="input" id="history-search" type="search" placeholder="Search by name, exercise or note" value=${q} onInput=${e => { setQ(e.target.value); setLimit(30); }}/></label></div>
    ${groups.map(g => html`<div style="margin-top:6px"><div class="eyebrow" style="margin:12px 0 4px">${parseYmd(g.k + '-01').toLocaleDateString('en-US', { month: 'long', year: 'numeric' })} · ${plural(g.items.length, 'workout')} · ${F.volu(g.vol)}</div>${g.items.map(w => html`<${WorkoutRow} app=${app} w=${w} key=${w.id}/>`)}</div>`)}
    ${!list.length ? html`<p class="hint">${qq ? 'No workouts match that search.' : 'No workouts yet.'}</p>` : null}
    ${list.length > limit ? html`<button class="btn sm" type="button" style="margin-top:10px" onClick=${() => setLimit(l => l + 30)}>Show more</button>` : null}
  </section>`;
}

function ExerciseForm({ app, x, onClose }) {
  const [f, setF] = useState(() => ({ name: x ? x.name : '', ticker: x ? (x.ticker || '') : '', type: x ? x.type || 'weighted' : 'weighted', muscle: x ? x.muscle || 'Other' : 'Other', notes: x ? x.notes || '' : '', archived: x ? !!x.archived : false }));
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [mus, setMus] = useState(() => { const mu = x ? musclesOf(x) : { primary: [], secondary: [], auto: true }; return { primary: mu.primary, secondary: mu.secondary, touched: x ? !mu.auto : false }; });
  const [touch, setTouch] = useState({ type: !!x, cat: !!x });
  const detect = () => { const mu = inferMuscles(f.name, f.muscle); setMus({ primary: mu.primary, secondary: mu.secondary, touched: false }); };
  const onName = e => {
    const name = e.target.value;
    let cat = f.muscle;
    if (!mus.touched) { const mu = inferMuscles(name, touch.cat ? f.muscle : 'Other'); setMus({ primary: mu.primary, secondary: mu.secondary, touched: false }); if (!touch.cat) cat = categoryFor(mu.primary); }
    setF(v => ({ ...v, name, muscle: cat, type: touch.type ? v.type : guessType(name) }));
  };
  const onCat = e => {
    const cat = e.target.value;
    setTouch(t => ({ ...t, cat: true }));
    setF(v => ({ ...v, muscle: cat }));
    if (!mus.touched) { const mu = inferMuscles(f.name, cat); setMus({ primary: mu.primary, secondary: mu.secondary, touched: false }); }
  };
  const taken = new Set(app.S.exercises.filter(e => !x || e.id !== x.id).map(e => e.ticker));
  const autoTicker = makeTicker(f.name || 'LIFT', taken);
  const save = async () => {
    const name = f.name.trim().replace(/\s+/g, ' ');
    if (!name) return setErr('Give the exercise a name.');
    if (name.length > 60) return setErr('Keep the name under 60 characters.');
    const clash = app.S.exercises.find(e => (!x || e.id !== x.id) && normName(e.name) === normName(name));
    if (clash) return setErr(`“${clash.name}” already exists${clash.archived ? ' (archived)' : ''}. Use a different name.`);
    const ticker = (f.ticker.trim() || autoTicker).toUpperCase();
    if (!/^[A-Z0-9]{1,5}$/.test(ticker)) return setErr('Tickers use 1–5 letters or digits.');
    if (taken.has(ticker)) return setErr(`Ticker ${ticker} is already used by another exercise.`);
    setBusy(true);
    const doc = x ? { ...x, name, ticker, type: f.type, muscle: f.muscle, notes: f.notes.trim().slice(0, 500), archived: f.archived, primary: mus.primary, secondary: mus.secondary, updatedAt: Date.now() }
      : { id: uid('x'), name, ticker, type: f.type, muscle: f.muscle, notes: f.notes.trim().slice(0, 500), archived: false, sample: false, primary: mus.primary, secondary: mus.secondary, createdAt: Date.now() };
    try { await backend.putExercise(doc); app.toast(x ? 'Exercise updated' : `${name} added`, 'good'); app.actions.syncBoard({ exercises: [...app.S.exercises.filter(e => e.id !== doc.id), doc] }); app.setExSel(doc.id); onClose(); }
    catch (e) { setBusy(false); setErr('Not saved: ' + describeDbError(e)); }
  };
  return html`<${Modal} title=${x ? 'Edit exercise' : 'New exercise'} onClose=${onClose}>
    <label class="field"><span>Name</span><input class="input" id="exf-name" maxlength="60" placeholder="e.g. Front Squat" value=${f.name} onInput=${onName}/></label>
    <div class="row" style="align-items:flex-end">
      <label class="field" style="flex:0 1 140px"><span>Ticker</span><input class="input mono" id="exf-ticker" maxlength="5" placeholder=${autoTicker} value=${f.ticker} onInput=${e => setF(v => ({ ...v, ticker: e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '') }))}/></label>
      <div class="field" style="flex:1 1 220px"><span>Type</span><${Seg} label="Exercise type" value=${f.type} options=${[['weighted', 'Weighted'], ['bodyweight', 'Bodyweight']]} onChange=${t => { setTouch(o => ({ ...o, type: true })); setF(v => ({ ...v, type: t })); }}/></div>
    </div>
    <p class="hint">${f.type === 'bodyweight' ? 'Bodyweight exercises track reps, plus any added weight such as a belt or vest. Set your bodyweight in Settings to include it in volume and 1RM.' : 'Weighted exercises track the load on the bar, machine or dumbbell.'}</p>
    <label class="field"><span>Category</span><select class="input" id="exf-muscle" value=${f.muscle} onChange=${onCat}>${MUSCLES.map(m => html`<option value=${m}>${m}</option>`)}</select></label>
    <${MuscleEditor} mus=${mus} setMus=${setMus} onDetect=${detect}/>
    <label class="field"><span>Notes (optional)</span><textarea class="input" id="exf-notes" maxlength="500" placeholder="Setup cues, seat height, grip" value=${f.notes} onInput=${e => setF(v => ({ ...v, notes: e.target.value }))}></textarea></label>
    ${x ? html`<label class="check"><input type="checkbox" checked=${f.archived} onChange=${e => setF(v => ({ ...v, archived: e.target.checked }))}/> Archived (hidden from the exercise picker, history kept)</label>` : null}
    ${err ? html`<p class="down" role="alert">${err}</p>` : null}
    <div class="modal-actions"><button class="btn ghost" type="button" onClick=${onClose}>Cancel</button><button class="btn primary" type="button" disabled=${busy} onClick=${save}>${busy ? 'Saving…' : x ? 'Save changes' : 'Create exercise'}</button></div>
  <//>`;
}

const catOfW = (app, w) => { const st = w && app.model.wStats.get(w.id); return (st && st.cat) || (w && CAT[w.category] ? w.category : catFromName(w && w.name)) || 'fullbody'; };
function draftCat(app, draft) {
  const areas = { push: 0, pull: 0, legs: 0, core: 0 };
  for (const en of draft.exercises) {
    const x = exOf(app.model, en.exerciseId), mu = app.model.exMus.get(x.id) || musclesOf(x);
    const W = mu.primary.length + SECONDARY_CREDIT * mu.secondary.length, n = en.sets.length || 1;
    if (!W) continue;
    mu.primary.forEach(m => { areas[MUSCLE_AREA[m]] += n / W; });
    mu.secondary.forEach(m => { areas[MUSCLE_AREA[m]] += n * SECONDARY_CREDIT / W; });
  }
  const auto = catFromName(draft.name) || catFromAreas(areas) || 'fullbody';
  return { auto, eff: CAT[draft.category] ? draft.category : auto };
}

function TrainingMix({ app }) {
  const { model, S } = app;
  const today = startOfDay(new Date()), from = ymd(addDays(today, -27)), T = ymd(today);
  const counts = {};

  for (const w of model.ws) if (w.date >= from && w.date <= T) { const c = catOfW(app, w); counts[c] = (counts[c] || 0) + 1; n++; }
  const present = CATS.filter(c => counts[c.id]);

    <div class="panel-head"><div><div class="panel-title">Training mix</div><div class="panel-sub">Workout types over the last 4 weeks · ${plural(n, 'workout')}</div></div></div>
    ${n ? html`<div class="cat-stack" role="img" aria-label=${present.map(c => `${c.name} ${counts[c.id]}`).join(', ')}>${present.map(c => html`<span style=${`--cc:var(--c-${c.id});flex:${counts[c.id]}`} title=${`${c.name}: ${counts[c.id]}`}></span>`)}</div>
      <div class="cat-legend" style="margin-top:10px">${present.map(c => html`<span class="row" style="gap:5px;flex-wrap:nowrap"><${CatBadge} id=${c.id} sm/><span class="mono soft">${counts[c.id]}</span></span>`)}</div>

      })}</div>`
      : html`<p class="hint">Workout types appear here once you log workouts in the last 4 weeks.</p>`}

function TypeBars({ app, buckets, group }) {
  const ref = useRef(null);
  const w = useWidth(ref);
  const [hi, setHi] = useState(null);
  const h = 200, padL = 4, padR = 36, padT = 10, padB = 24;
  const iw = Math.max(40, w - padL - padR), ih = h - padT - padB;
  const max = Math.max(1, ...buckets.map(b => b.workouts));
  const step = max <= 5 ? 1 : max <= 12 ? 2 : 5, y1 = Math.ceil(max / step) * step, yt = [];
  for (let v = 0; v <= y1; v += step) yt.push(v);
  const Y = v => padT + (1 - v / y1) * ih;
  const n = Math.max(1, buckets.length), slot = iw / n, gap = Math.max(2, Math.min(8, slot * 0.3)), bw = Math.max(1, slot - gap), every = Math.max(1, Math.ceil(54 / slot));
  const hb = hi != null ? buckets[hi] : null;
  let tipStyle = null;
  if (hb) { const cx = padL + hi * slot + slot / 2; tipStyle = cx > w / 2 ? { right: `${Math.max(4, w - cx + 10)}px` } : { left: `${cx + 10}px` }; }
  return html`<div class="chart" ref=${ref}>
    <svg width=${w} height=${h} viewBox=${`0 0 ${w} ${h}`} role="img" aria-label=${`${GROUP_ADJ[group]} workouts stacked by type`} tabindex="0" onBlur=${() => setHi(null)} onPointerLeave=${e => { if (e.pointerType !== 'touch') setHi(null); }}
      onKeyDown=${e => { if (e.key === 'ArrowLeft') { e.preventDefault(); setHi(i => Math.max(0, (i == null ? buckets.length : i) - 1)); } else if (e.key === 'ArrowRight') { e.preventDefault(); setHi(i => Math.min(buckets.length - 1, (i == null ? -1 : i) + 1)); } else if (e.key === 'Escape') setHi(null); }}>
      ${yt.map(v => html`<line class="grid" x1=${padL} x2=${padL + iw} y1=${Y(v)} y2=${Y(v)}/>`)}
      ${yt.map(v => html`<text class="axis" x=${padL + iw + 8} y=${Y(v) + 3.5}>${v}</text>`)}
      ${buckets.map((b, i) => {
        const x = padL + i * slot + gap / 2;
        let acc = 0;
        return html`<g>
          ${CATS.filter(c => b.cats[c.id]).map(c => { const v = b.cats[c.id], top = Y(acc + v), hgt = Y(acc) - top; acc += v; return html`<rect x=${x} y=${top + 1} width=${bw} height=${Math.max(1, hgt - 2)} rx="2" fill=${catVar(c.id)} opacity=${hi == null || hi === i ? 1 : 0.45}/>`; })}
          ${i % every === 0 ? html`<text class="axis" x=${Math.min(padL + iw - 14, Math.max(padL + 14, x + bw / 2))} y=${h - 7} text-anchor="middle">${bucketShort(b, group === 'week' ? 'week' : 'month')}</text>` : null}
          <rect x=${padL + i * slot} y=${padT} width=${slot} height=${ih} fill="transparent" onPointerMove=${() => setHi(i)} onPointerDown=${() => setHi(i)}/>
        </g>`;
      })}
    </svg>
    ${hb ? html`<div class="tip" style=${tipStyle}><div class="tip-date">${bucketLabel(hb, group === 'week' ? 'week' : 'month')}</div><div class="tip-val">${plural(hb.workouts, 'workout')}</div>
      <dl class="tip-rows">${CATS.filter(c => hb.cats[c.id]).map(c => html`<dt><${CatBadge} id=${c.id} sm/></dt><dd>${hb.cats[c.id]}</dd>`)}</dl></div>` : null}
  </div>`;
}
function TypeSection({ app, rb }) {
  const { model, F, S } = app;
  const [group, setGroup] = useState(rb.len > 200 ? 'month' : 'week');
  const buckets = periodBuckets(model, group, rb, S.settings.weekStart === 0 ? 0 : 1);

    const st = model.wStats.get(w.id), t = tot[st.cat] || (tot[st.cat] = { n: 0, sets: 0, volume: 0, prs: 0 });
    t.n++; t.sets += st.doneSets; t.volume += st.volume; t.prs += st.prs.length; n++;
  }
  const present = CATS.filter(c => tot[c.id]);
  return html`<h2 class="section-title">Workout types · ${rb.label}</h2>
    <div class="cols">
      <section class="panel"><div class="panel-head"><div><div class="panel-title">Workouts by type</div><div class="panel-sub">${GROUP_ADJ[group]} workout count, stacked by type</div></div><${Seg} cls="sm" label="Grouping" value=${group} options=${[['week', 'Week'], ['month', 'Month']]} onChange=${setGroup}/></div>
        ${n ? html`<${TypeBars} app=${app} buckets=${buckets} group=${group}/><div style="margin-top:8px"><${CatLegend} ids=${present.map(c => c.id)}/></div>` : html`<p class="hint">No workouts in the ${rb.label}.</p>`}</section>

        ${n ? html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Type</th><th class="r">Workouts</th><th class="r">Share</th><th class="r">Sets</th><th class="r">Volume</th><th class="r">PRs</th></tr></thead>
          <tbody>${present.map(c => { const t = tot[c.id]; return html`<tr><td><${CatBadge} id=${c.id}/></td><td class="r">${t.n}</td><td class="r">${fmtNum(t.n / n * 100, 0)}%</td><td class="r">${fmtInt(t.sets)}</td><td class="r">${F.volu(t.volume)}</td><td class="r">${t.prs}</td></tr>`; })}</tbody></table></div>
          <p class="hint" style="margin-top:8px">Types are set when you log a workout (or detected from its name and muscles) and stay with it in history.</p>` : html`<p class="hint">No workouts in the ${rb.label}.</p>`}</section>
    </div>`;
}

function MiniBars({ vals }) {

  })}</svg>`;
}

function useProfiles(ids) {
  const key = ids.slice().sort().join(',');
  const [map, setMap] = useState({});
  useEffect(() => {
    let alive = true;
    if (!userCap || typeof userCap.profiles !== 'function' || !ids.length) return undefined;
    userCap.profiles(ids).then(p => { if (alive) setMap(p || {}); }).catch(() => {});
    return () => { alive = false; };
  }, [key]);
  return map;
}
function TierChip({ t }) { return html`<span class=${'chip tier ' + t[0]}>${t[1]}</span>`; }
function StandRow({ app, s }) {

    <span style="font-weight:500;min-width:0">${s.key.startsWith('muscle:') ? html`<${AreaDot} m=${s.key.slice(7)}/> ` : null}${s.label}</span><span class="mono soft">#${s.rank} of ${s.n}</span>
    <span class="mono muted">${s.pct == null ? '—' : ordinal(Math.round(s.pct))}</span><span>${t ? html`<${TierChip} t=${t}/>` : null}</span>

function DistStrip({ rows, meId, fmt, nameOf }) {
  const ref = useRef(null);
  const w = useWidth(ref);
  const [hi, setHi] = useState(null);
  const h = 84, padX = 16, base = h - 24;
  const sorted = rows.slice().sort((a, b) => a.v - b.v);
  const lo = sorted.length ? sorted[0].v : 0, top = sorted.length ? sorted[sorted.length - 1].v : 1, span = top - lo || 1;
  const X = v => padX + (v - lo) / span * (w - 2 * padX);
  const placed = [];
  for (const r of sorted) { const x = X(r.v); let lvl = 0; while (lvl < 4 && placed.some(p => p.lvl === lvl && Math.abs(p.x - x) < 11)) lvl++; placed.push({ r, x, lvl, y: base - 7 - lvl * 11 }); }
  const q = p => { const i = p / 100 * (sorted.length - 1), a = Math.floor(i), b = Math.ceil(i); return sorted[a].v + (sorted[b].v - sorted[a].v) * (i - a); };
  const ticks = [];
  for (const p of [25, 50, 75, 90]) { const x = X(q(p)); if (!ticks.length || x - ticks[ticks.length - 1].x > 30) ticks.push({ p, x }); }
  const me = placed.find(p => p.r.e.id === meId);
  const onMove = e => { const r = e.currentTarget.getBoundingClientRect(), px = (e.clientX - r.left) * (w / r.width); let bi = null, bd = Infinity; placed.forEach((p, i) => { const d = Math.abs(p.x - px); if (d < bd) { bd = d; bi = i; } }); setHi(bi); };
  const hp = hi != null ? placed[hi] : null;
  return html`<div class="chart" ref=${ref}>
    <svg width=${w} height=${h} viewBox=${`0 0 ${w} ${h}`} role="img" aria-label=${`Distribution of ${rows.length} results${me ? `, you rank ${me.r.rank}` : ''}`} tabindex="0" onPointerMove=${onMove} onPointerDown=${onMove} onPointerLeave=${e => { if (e.pointerType !== 'touch') setHi(null); }} onBlur=${() => setHi(null)}>
      <line class="grid" x1=${padX} x2=${w - padX} y1=${base} y2=${base}/>
      ${ticks.map(t => html`<g><line x1=${t.x} x2=${t.x} y1=${base - 54} y2=${base + 4} stroke="var(--line-2)" stroke-dasharray="2 3"/><text class="axis" x=${t.x} y=${h - 6} text-anchor="middle">${t.p}th</text></g>`)}
      ${placed.map(p => (p === me ? null : html`<circle cx=${p.x} cy=${p.y} r="4.5" fill="var(--series)" fill-opacity="0.6" stroke="var(--bg)" stroke-width="1.5"/>`))}
      ${me ? html`<g><circle cx=${me.x} cy=${me.y} r="7" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/><text class="tag-text" x=${Math.min(w - 16, Math.max(16, me.x))} y=${Math.max(10, me.y - 12)} text-anchor="middle" fill="var(--accent)">You</text></g>` : null}
      ${hp ? html`<circle cx=${hp.x} cy=${hp.y} r="9" fill="none" stroke="var(--fg)" stroke-width="1.5"/>` : null}
    </svg>
    ${hp ? html`<div class="tip" style=${hp.x > w / 2 ? { left: '4px' } : { right: '4px' }}><div class="tip-date">${nameOf(hp.r.e)}</div><div class="tip-val">${fmt(hp.r.v)}</div><dl class="tip-rows"><dt>Rank</dt><dd>#${hp.r.rank} of ${hp.r.n}</dd><dt>Percentile</dt><dd>${hp.r.pct == null ? '—' : ordinal(Math.round(hp.r.pct))}</dd></dl></div>` : null}
  </div>`;
}

/* ---------------- privacy, legal & consent screens ---------------- */
function DocBlock({ b, notes }) {
  if (typeof b === 'string') return html`<p>${b}</p>`;
  if (b.ul) return html`<ul>${b.ul.map(x => html`<li>${x}</li>`)}</ul>`;
  if (b.note) return notes ? html`<p class="rnote"><span class="rnote-tag">Review</span>${b.note}</p>` : null;
  if (b.table) {
    const [head, ...rows] = b.table;
    return html`<div class="doc-cards" role="list">${rows.map(r => html`<div class="doc-card" role="listitem"><b>${r[0]}</b>${r.slice(1).map((c, i) => html`<span><span class="dc-l">${head[i + 1]}</span>${c}</span>`)}</div>`)}</div>`;
  }
  return null;
}
// Section links scroll in place: the app routes on the URL hash, so in-page anchors would change pages.
function LegalDoc({ id, notes, compact }) {
  const d = LEGAL_DOCS[id];
  const jump = i => { const el = document.getElementById(`doc-${id}-${i}`); if (el) el.scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth', block: 'start' }); };
  return html`<div class="doc">
    <header><h2>${d.title}</h2><div class="doc-meta">Version ${d.v} · Effective ${fmtD(d.eff, { month: 'long', day: 'numeric', year: 'numeric' })}</div></header>
    <div class="draft-flag" role="note"><strong>Draft for review.</strong> Written to match how Lift Ledger works today. It has not been reviewed by a lawyer yet, and it does not claim that the app meets any particular law or certification.</div>
    <p class="doc-sum">${d.summary}</p>
    ${!compact && d.sections.length > 3 ? html`<nav class="toc" aria-label=${`${d.title} sections`}>${d.sections.map(([h], i) => html`<button type="button" onClick=${() => jump(i)}>${h}</button>`)}</nav>` : null}
    ${d.sections.map(([h, blocks], i) => html`<section id=${`doc-${id}-${i}`}><h3>${h}</h3>${blocks.map(b => html`<${DocBlock} b=${b} notes=${notes}/>`)}</section>`)}
  </div>`;
}
function LegalHistory() {

    <p>A new major version (for example 2.0) is a significant change: Lift Ledger asks everyone to review and accept it before continuing. A minor version (for example 1.1) shows a notice instead.</p>

  </div>`;
}

  }

    <h1>${renewing ? 'We’ve updated our terms' : 'Before you start'}</h1>
    <p class="gate-lead">${renewing ? `${LEGAL_HISTORY[0].summary} Please review and accept to keep using Lift Ledger. Your data hasn’t changed.` : 'Please read and accept these documents. They describe how Lift Ledger works and how your information is handled.'}</p>

function ExportModal({ app, onClose }) {
  const { S } = app;
  const [busy, setBusy] = useState(false);
  const [text, setText] = useState(null);
  const taRef = useRef(null);
  const name = `lift-ledger-data-${todayStr()}.json`;
  const build = async () => {
    let board = null;
    try { if (backend && backend.getMyBoard) { const snap = await backend.getMyBoard(); board = snap && snap.exists && typeof snap.data === 'function' ? snap.data() : null; } } catch (e) { board = null; }
    return buildExport(S, { consent: S.consent, board, requests: S.myRequests });
  };
  const save = async () => {
    setBusy(true);
    const json = await build();
    setBusy(false);
    if (!dlCap) { setText(json); return; }
    try { await dlCap.save({ filename: name, data: json }); app.toast('Your data was saved', 'good'); app.actions.logActivity('export', 'Downloaded all data (JSON)'); }
    catch (e) { if (e && e.code === 'declined') return; setText(json); app.toast('Download unavailable here. Copy the text instead.', 'bad'); }
  };
  const copy = () => {
    const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject(new Error('no clipboard'));
    p.then(() => { app.toast('Copied to clipboard', 'good'); app.actions.logActivity('export', 'Copied all data (JSON)'); }).catch(() => { if (taRef.current) { taRef.current.focus(); taRef.current.select(); } app.toast('Press Ctrl+C or ⌘C to copy the selected text.', 'info'); });
  };
  return html`<${Modal} title="Download my data" onClose=${onClose}>
    <p>One JSON file with everything Lift Ledger stores about you: ${plural(S.workouts.length, 'workout')}, ${plural(S.exercises.length, 'exercise')}, ${plural(S.plans.length, 'plan')}, your profile and settings, your consent record, your leaderboard entry if you have one, requests you sent, and what’s saved in this browser.</p>
    ${text ? html`<textarea class="input csv-box" ref=${taRef} readonly rows="6" aria-label="Your data as JSON" value=${text}></textarea>` : null}
    <div class="modal-actions">
      <button class="btn" type="button" onClick=${() => app.setModal({ kind: 'csv' })}>${Ic.download()} Sets as CSV</button>
      ${text ? html`<button class="btn primary" type="button" onClick=${copy}>${Ic.copy()} Copy</button>` : html`<button class="btn primary" type="button" disabled=${busy} onClick=${save}>${Ic.download()} ${busy ? 'Preparing…' : dlCap ? `Download ${name}` : 'Show my data'}</button>`}
    </div>
  <//>`;
}

const readRoute = () => { const h = (location.hash || '').replace('#', ''); return ROUTES.includes(h) ? h : 'dashboard'; };
async function runPool(tasks, n, onDone) {
  let i = 0, failed = 0;
  const worker = async () => {
    while (i < tasks.length) {
      const t = tasks[i++];
      try { await t(); }
      catch (e) { if (e && e.code === 'resource_exhausted') { await sleep(1500); try { await t(); } catch (e2) { failed++; } } else failed++; }
      onDone();
    }
  };
  await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, worker));
  return failed;
}

function App() {
  const S = useStore();
  const [route, setRoute] = useState(readRoute);
  useEffect(() => { const f = () => setRoute(readRoute()); window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);
  useEffect(() => { window.scrollTo(0, 0); }, [route]);
  useEffect(() => { const s = sectionOf(route); if (s.id === 'workouts' || s.id === 'progress') lastSub[s.id] = route; }, [route]);
  // On phones, wide tables turn into stacked cards: copy each column heading onto its cells as a label.
  useEffect(() => {
    const label = () => {
      for (const t of document.querySelectorAll('table.tbl:not(.no-stack)')) {
        const heads = t.tHead && t.tHead.rows[0] ? [...t.tHead.rows[0].cells].map(c => c.textContent.trim()) : [];
        if (heads.length < 4) continue;
        t.classList.add('stackable');
        if (heads[0] === '#') t.classList.add('num-first');
        for (const r of t.tBodies[0] ? t.tBodies[0].rows : []) [...r.cells].forEach((c, i) => { const l = heads[i] || ''; if (c.getAttribute('data-label') !== l) c.setAttribute('data-label', l); });
      }
    };
    let raf = 0;
    const mo = new MutationObserver(() => { clearTimeout(raf); raf = setTimeout(label, 60); });
    const root = document.getElementById('app');
    if (root) mo.observe(root, { childList: true, subtree: true });
    label();
    return () => { mo.disconnect(); clearTimeout(raf); };
  }, []);
  // On touch screens: keep the focused field in view and clear the bottom bar while the keyboard is up.
  useEffect(() => {
    if (!COARSE) return undefined;
    const isField = t => t && t.matches && t.matches('input:not([type=checkbox]):not([type=color]):not([type=date]), textarea');
    const onIn = e => { if (!isField(e.target)) return; document.body.classList.add('kb-open'); const t = e.target; setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) { /* ignore */ } }, 300); };
    const onOut = () => setTimeout(() => { if (!isField(document.activeElement)) document.body.classList.remove('kb-open'); }, 120);
    const vv = window.visualViewport;
    const onVv = () => { const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop); document.documentElement.style.setProperty('--kb', `${kb > 80 ? Math.round(kb) : 0}px`); };
    document.addEventListener('focusin', onIn);
    document.addEventListener('focusout', onOut);
    if (vv) { vv.addEventListener('resize', onVv); vv.addEventListener('scroll', onVv); }
    return () => { document.removeEventListener('focusin', onIn); document.removeEventListener('focusout', onOut); if (vv) { vv.removeEventListener('resize', onVv); vv.removeEventListener('scroll', onVv); } };
  }, []);
  // Apply any custom workout-type colors as CSS variables so every view picks them up.
  useEffect(() => {
    const cc = S.settings.catColors || {};
    for (const c of CATS) document.documentElement.style.setProperty('--c-' + c.id, /^#[0-9a-f]{6}$/i.test(cc[c.id] || '') ? cc[c.id] : c.color);
  }, [S.settings.catColors]);
  const model = useMemo(() => buildModel(S.workouts, S.exercises, S.settings), [S.workouts, S.exercises, S.settings]);
  const F = useMemo(() => makeFmt(S.settings), [S.settings]);
  const [draft, setDraftState] = useState(loadDraft);
  const setDraft = useCallback(upd => setDraftState(prev => { const next = typeof upd === 'function' ? upd(prev) : upd; scheduleDraftSave(next); return next; }), []);
  const [ana, setAna] = useState(() => ({ ex: null, metric: null, range: RANGE_KEYS.includes(lsGet('ll.range')) ? lsGet('ll.range') : '3M', view: lsGet('ll.anaView') === 'muscle' ? 'muscle' : 'exercise', muscle: null, mMetric: 'workload', group: null, cmpSlots: null, cmpMetric: 'wsets' }));
  const [histDate, setHistDate] = useState(null);
  const [exSel, setExSel] = useState(null);
  const [cmp, setCmp] = useState({ a: null, b: null });
  const [modal, setModal] = useState(null);

  const [rank, setRank] = useState({ mode: null, board: 'score', rel: false, cohort: 'all' });
  const [legalDoc, setLegalDoc] = useState('privacy');
  const [ageBlocked, setAgeBlocked] = useState(readAgeBlock);
  const [deleted, setDeleted] = useState(false);
  const [sessionLegal, setSessionLegal] = useState(null);
  const compOn = compOf(S.settings).enabled;
  const rankData = useMemo(() => {
    if (!compOn || !rankable(S)) return null;

    const mode = rank.mode || (live.length >= MIN_GROUP ? 'live' : 'preview');

  }, [compOn, S.mode, S.board, rank.mode, S.workouts, S.exercises, S.settings, model.showSample, S.myId]);
  // Only people who opted in subscribe to the shared leaderboard.
  useEffect(() => {
    if (!S.ready || !rankable(S) || !compOn || !backend || !backend.watchBoard) return undefined;
    const un = backend.watchBoard();
    return () => { un(); store.set({ board: [] }); };
  }, [S.ready, S.mode, compOn]);
  // Opted out but an entry still exists (e.g. a delete failed while offline): remove it.
  const cleaned = useRef(false);
  useEffect(() => {
    if (!S.settingsLoaded || !rankable(S) || cleaned.current || !backend || !backend.getMyBoard) return;
    cleaned.current = true;
    if (!compOf(store.state.settings).enabled) backend.getMyBoard().then(snap => (snap && snap.exists ? backend.deleteBoard() : null)).catch(() => {});
  }, [S.settingsLoaded, S.mode]);
  // Rankings are 18+: switch them off, deleting the leaderboard entry, when someone is or becomes a minor.

  useEffect(() => {

  }, [S.settingsLoaded, S.settings]);
  // Only the page owner reads the requests inbox.
  useEffect(() => {
    if (!S.isOwner || !backend || !backend.watchInbox) return undefined;
    const un = backend.watchInbox();
    return () => { un(); store.set({ inbox: [] }); };
  }, [S.isOwner, S.mode]);
  const toast = useCallback((msg, tone, ms) => { const id = rk(); setToasts(t => [...t.slice(-2), { id, msg, tone: tone || 'info' }]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), ms || 4000); }, []);
  const confirm = useCallback(opts => new Promise(res => setModal({ kind: 'confirm', ...opts, resolve: res })), []);
  const dangerConfirm = useCallback(opts => new Promise(res => setModal({ kind: 'danger', ...opts, resolve: res })), []);
  const openLegal = useCallback(d => { setLegalDoc(d); if (location.hash !== '#legal') location.hash = 'legal'; else window.scrollTo(0, 0); }, []);
  const blockAge = useCallback(() => { lsSet(AGE_BLOCK_KEY, JSON.stringify({ blocked: true, at: Date.now() })); setAgeBlocked(true); }, []);
  // Appends to the consent record the page owner can read. The private settings copy is what the app itself relies on.
  const recordConsent = async (entries, o) => {
    if (!backend || !backend.putConsent || (!entries.length && !o)) return;
    const cur = store.state.consent || { docs: {}, minimumAge: false, ageAt: null, history: [] };
    const at = Date.now();
    const next = { v: 1, docs: { ...cur.docs }, minimumAge: cur.minimumAge, ageAt: cur.ageAt, updatedAt: at,
      history: [...cur.history, ...entries.map(e => ({ k: e.k, granted: !!e.granted, v: e.v || null, at }))].slice(-100) };
    if (o && o.docs) for (const d of o.docs) next.docs[d] = { v: LEGAL_DOCS[d].v, at };
    if (o && o.age) { next.minimumAge = true; next.ageAt = at; }
    try { await backend.putConsent(next); } catch (e) { console.error(e); }
  };
  const nav = useCallback(r => { if (location.hash !== '#' + r) location.hash = r; else setRoute(r); }, []);
  useEffect(() => { if (S.ready && !draftHasContent(draft) && !draft.editing && draft.unit !== S.settings.unit) setDraft(d => ({ ...d, unit: S.settings.unit === 'kg' ? 'kg' : 'lb' })); }, [S.ready, S.settings.unit]);

  const fail = (e, what) => { console.error(e); toast(`${what}: ${describeDbError(e)}`, 'bad', 7000); };
  const guardDraft = async (targetId) => {
    if (draftHasContent(draft) && draft.id !== targetId) return confirm({ title: 'Replace the current draft?', body: 'You have an unsaved workout in Log Workout. Continuing discards it.', ok: 'Discard draft', danger: true });

      if (['bodyweight', 'bodyweightUnit', 'formula', 'weekStart'].some(k => k in patch)) actions.syncBoard({ settings: { ...S.settings, ...patch } });
    },
    async createExercise({ name, type, muscle, primary, secondary }) {

        toast(`${existing.name} is already in your library. Added it.`, 'info');
